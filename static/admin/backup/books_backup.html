<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Book — Kütüphanem</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/admin/css/custom.css"/>

  <script>
    tailwind.config = {
      darkMode:'class',
      theme:{ extend:{
        colors:{ brand:{600:'#4f46e5'} },
        boxShadow:{soft:'0 8px 30px rgba(0,0,0,.08)'}
      } }
    }
  </script>

  <!-- token yoksa login'e -->
  <script>
    (function(){
      if(!localStorage.getItem('token')){
        window.location.replace('/static/admin/login.html');
      }
    })();
  </script>
</head>

<body class="h-full bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100"
      x-data="app()" x-init="init()">
  <div id="toast-root" class="fixed top-4 right-4 z-50 space-y-2"></div>

  <div class="max-w-6xl mx-auto p-5 sm:p-8">
    <!-- HEADER -->

              </svg>
            </button>

            <div x-show="open" @click.outside="open=false" x-transition
                 class="absolute right-0 mt-2 w-48 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow-lg overflow-hidden z-50">

    <div id="site-header" data-active="books" data-show-add="true"></div>

    <!-- SAYFA TOOLBAR: sadece books.html -->
    <div class="mb-5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <h1 class="text-xl font-semibold">Kütüphanem</h1>
        <span class="text-xs px-2 py-1 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300"
              x-text="books?.length ? books.length + ' kitap' : ''"></span>
      </div>

      <div class="flex items-center gap-2">
        <label class="hidden sm:flex items-center gap-2 text-sm text-gray-600 dark:text-gray-300">
          <!-- <span>Sırala</span> -->
          <select x-model="sort" class="px-3 py-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800">
            <option value="created_desc">Eklenme Tarihi (Yeni -> Eski)</option>
            <option value="created_asc">Eklenme Tarihi (Eski -> Yeni)</option>
            <option value="started_desc">Başlama Tarihi (Yeni -> Eski)</option>
            <option value="started_asc">Başlama Tarihi (Eski -> Yeni)</option>
            <option value="rating_desc">Puan (Yüksek -> Düşük)</option>
            <option value="rating_asc">Puan (Düşük -> Yüksek)</option>
          </select>
        </label>
        <select x-model="sort" class="sm:hidden px-3 py-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm">
          <option value="created_desc">Eklenme (Yeni -> Eski)</option>
          <option value="created_asc">Eklenme (Eski -> Yeni)</option>
          <option value="started_desc">Başlama (Yeni -> Eski)</option>
          <option value="started_asc">Başlama (Eski -> Yeni)</option>
          <option value="rating_desc">Puan (Yüksek -> Düşük)</option>
          <option value="rating_asc">Puan (Düşük -> Yüksek)</option>
        </select>
        <!-- (İstersen filtre/arama ekleyebilirsin) -->
        <button class="px-3 py-2 rounded-lg bg-brand-600 text-white hover:opacity-95"
                @click="openAdd()">
          Ekle
        </button>
      </div>
    </div>

    <!-- GRID -->
    <section class="bg-transparent">
      <template x-if="loading">
        <div class="p-6 text-center text-gray-500">Yükleniyor…</div>
      </template>

      <template x-if="!loading && books.length===0">
        <div class="p-12 text-center text-gray-500 border border-dashed border-gray-300 dark:border-gray-700 rounded-2xl">
          Henüz kitap yok. <button class="text-brand-600 underline" @click="openAdd()">Hemen ekle</button>.
        </div>
      </template>

      <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-5">
        <template x-for="b in sortedBooks()" :key="b.id">
          <div class="rounded-2xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-soft overflow-hidden flex flex-col transition-transform duration-150 hover:-translate-y-0.5 hover:shadow-lg">

            <!-- Kapak: karta tam oturur + tıklanınca detay -->
            <div class="relative w-full aspect-[2/3]">
              <a :href="'/static/admin/book.html?id='+b.id" class="absolute inset-0 z-[1]" aria-label="Detay"></a>
              <img :src="b.cover_url || ''"
                   class="absolute inset-0 h-full w-full object-cover rounded-t-2xl"
                   @error="$event.target.style.display='none'">

              <!-- Favori -->
              <button
                class="absolute top-3 right-3 z-20 rounded-full p-2 bg-white/90 dark:bg-gray-900/70 border border-gray-200 dark:border-gray-700
                      transition transform duration-150"
                :class="{'scale-110 ring-2 ring-rose-300/60': b._favAnim, 'opacity-60 pointer-events-none': b._favBusy}"
                @click.stop="toggleFavorite(b)"
                :title="b.favorite ? 'Favoriden çıkar' : 'Favoriye ekle'">

                <!-- hafif “pulse” efekti -->
                <span class="absolute inset-0 rounded-full pointer-events-none"
                      x-show="b._favAnim" x-transition.opacity
                      style="box-shadow: 0 0 0 6px rgba(244, 63, 94, 0.25);"></span>

                <!-- Kalp ikonu: dolu/boş -->
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5"
                    :class="b.favorite ? 'text-rose-500' : 'text-gray-400'"
                    viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" role="img">
                  <!-- DOLU (favorite=true) -->
                  <path x-show="b.favorite" x-transition
                        d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.198 3 12.74 3 10.25 3 7.75 4.99 6 7.318 6 8.83 6 10.273 6.802 11 8.027 11.727 6.802 13.17 6 14.682 6 17.01 6 19 7.75 19 10.25c0 2.49-1.688 4.948-3.989 7.257a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.218l-.022.012-.007.003a.75.75 0 01-.666 0z"/>
                  <!-- BOŞ (favorite=false) -->
                  <path x-show="!b.favorite" x-transition fill="none" stroke="currentColor" stroke-width="1.8"
                        d="M12 21s-7-4.35-7-10.5A4.5 4.5 0 0 1 9.5 6c1.54 0 2.82.74 3.5 1.88C13.68 6.74 14.96 6 16.5 6A4.5 4.5 0 0 1 19 10.5C19 16.65 12 21 12 21z"/>
                </svg>
              </button>


              <!-- Durum -->
              <div class="absolute bottom-3 left-3">
                <span :class="b.is_finished ? 'bg-emerald-600 text-white' : 'bg-amber-500 text-white'"
                      class="text-[11px] px-2 py-1 rounded-full shadow">
                  <span x-text="b.is_finished ? 'Bitti' : 'Devam'"></span>
                </span>
              </div>
            </div>

            <!-- İçerik -->
            <div class="p-4 flex-1 flex flex-col">
              <div class="mb-1 font-medium truncate" x-text="b.title"></div>
              <div class="text-xs text-gray-500 mb-3 truncate" x-text="(b.author||'-') + (b.category ? ' • '+b.category : '')"></div>

              <!-- Progress -->
              <template x-if="(b.total_pages||0) > 0">
                <div class="mb-2">
                  <div class="h-2 rounded bg-gray-200 dark:bg-gray-700 overflow-hidden">
                    <div class="h-2 bg-brand-600" :style="`width: ${progressPct(b)}%`"></div>
                  </div>
                  <div class="mt-1 text-[11px] text-gray-500" x-text="progressText(b)"></div>
                </div>
              </template>

              <!-- Etiketler -->
              <template x-if="b.tags">
                <div class="mt-auto flex flex-wrap gap-1 pt-2">
                  <template x-for="tag in b.tags.split(',').map(t=>t.trim()).filter(Boolean)">
                    <span class="text-[11px] px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300">
                      <span x-text="tag"></span>
                    </span>
                  </template>
                </div>
              </template>

              <!-- Aksiyonlar: ikonlu -->
              <div class="mt-3 flex items-center justify-between">
                <span class="text-xs text-gray-500" x-text="(b.total_pages||0)+' sayfa'"></span>
                <span x-show="b.rating !== null && b.rating !== undefined"
                      class="text-[11px] px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 border border-gray-200 dark:border-gray-600 inline-flex items-center gap-1">
                  <span aria-hidden="true">&#9733;</span>
                  <span x-text="b.rating + '/100'"></span>
                </span>
              </div>

            </div>
          </div>
        </template>
      </div>
    </section>
  </div>

  <!-- ADD MODAL -->
  <div x-show="add.open" x-transition.opacity class="fixed inset-0 z-50 flex items-center justify-center">
    <div class="absolute inset-0 bg-black/50" @click="closeAdd()"></div>
    <div @keydown.escape.window="closeAdd()"
         class="relative w-full max-w-2xl mx-auto rounded-2xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-soft p-5">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold">Yeni Kitap Ekle</h3>
        <button class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300" @click="closeAdd()">✕</button>
      </div>

      <div class="grid sm:grid-cols-2 gap-4">
        <!-- Sol -->
        <div class="space-y-3">
          <label class="block">
            <span class="text-sm">Başlık <span class="text-red-500">*</span></span>
            <input x-model="form.title" placeholder="Örn. Dune"
                   class="mt-1 w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
          </label>

          <label class="block">
            <span class="text-sm">Yazar</span>
            <input x-model="form.author" placeholder="Örn. Frank Herbert"
                   class="mt-1 w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
          </label>

          <label class="block">
            <span class="text-sm">Toplam Sayfa <span class="text-red-500">*</span></span>
            <input x-model.number="form.total_pages" type="number" min="1" placeholder="Örn. 600"
                   class="mt-1 w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
          </label>

          <label class="block">
            <span class="text-sm">Kategori</span>
            <input x-model="form.category" placeholder="Örn. Bilimkurgu"
                   class="mt-1 w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
          </label>
        </div>

        <!-- Sağ -->
        <div class="space-y-3">
          <label class="block">
            <span class="text-sm">Kapak URL</span>
            <input x-model="form.cover_url" placeholder="https://..."
                   class="mt-1 w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
          </label>

          <label class="block">
            <span class="text-sm">Etiketler</span>
            <input x-model="form.tags" placeholder="kurgu, klasik, ... (virgülle)"
                   class="mt-1 w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
          </label>

          <div class="grid grid-cols-2 gap-3">
            <label class="block">
              <span class="text-sm">Başlangıç Tarihi</span>
              <input x-model="form.started_at" type="date"
                     class="mt-1 w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
            </label>
            <label class="block">
              <span class="text-sm">Bitiş Tarihi</span>
              <input x-model="form.finished_at" type="date" :disabled="!form.is_finished"
                     class="mt-1 w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
            </label>
          </div>

          <div class="grid grid-cols-2 gap-3 items-end">
            <!-- Toggle -->
            <div class="block">
              <span class="text-sm">Okuma Durumu</span>
              <label for="add_is_finished" class="mt-1 flex items-center gap-3 select-none cursor-pointer">
                <!-- checkbox görünmez, toggle’ın mantığı -->
                <input id="add_is_finished" type="checkbox" x-model="form.is_finished" class="sr-only peer">
                <!-- ray -->
                <span class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors duration-200
                            bg-gray-300 dark:bg-gray-700 peer-checked:bg-emerald-500">
                  <!-- topuz -->
                  <span class="absolute left-0.5 inline-block h-5 w-5 rounded-full bg-white shadow
                              transform transition-transform duration-200"
                        :class="form.is_finished ? 'translate-x-5' : ''"></span>

                </span>
                <!-- etiket -->
                <span class="text-sm" x-text="form.is_finished ? 'Bitti' : 'Devam Ediyor'"></span>
              </label>
              <!-- <p class="mt-1 text-xs text-gray-500 dark:text-gray-400" x-show="form.is_finished">
                Bitti olarak işaretleyince <strong>bitiş tarihi</strong> alanı aktif olur.
              </p> -->
            </div>
            <!-- PUAN (Bitti ise göster) -->
            <div class="col-span-2" x-show="form.is_finished">
              <label class="block">
                <span class="text-sm">Puan (0–100)</span>
                <input x-model.number="form.rating" type="number" min="0" max="100" step="1" placeholder="Örn. 85"
                       :disabled="!form.is_finished"
                      class="mt-1 w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
              </label>
              <p class="mt-1 text-xs text-gray-500">Sadece “Bitti” işaretliyken kaydedilir.</p>
            </div>

            <!-- Sağ sütun boş (ileride başka alan eklemek istersen kullanırsın) -->
            <div></div>
          </div>

          <!-- <label class="inline-flex items-center gap-2">
            <input id="add_favorite" type="checkbox" x-model="form.favorite" class="h-4 w-4">
            <span class="text-sm select-none">Favori</span>
          </label> -->
        </div>
      </div>

      <label class="block mt-3">
        <span class="text-sm">Notlar</span>
        <textarea x-model="form.notes" rows="3" placeholder="İlk izlenimlerin, alıntılar, vb."
                  class="mt-1 w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600"></textarea>
      </label>

      <div class="mt-4 flex items-center justify-end gap-3">
        <span class="text-xs text-gray-500 mr-auto"><span class="text-red-500">*</span> zorunlu alanlar</span>
        <button class="px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700" @click="closeAdd()">İptal</button>
        <button class="px-4 py-2 rounded-lg bg-brand-600 text-white hover:opacity-95" @click="createBook()">Ekle</button>
      </div>
    </div>
  </div>

  <!-- EDIT MODAL -->
  <div x-show="edit.open" x-transition.opacity class="fixed inset-0 z-50 flex items-center justify-center">
    <div class="absolute inset-0 bg-black/50" @click="closeEdit()"></div>
    <div @keydown.escape.window="closeEdit()"
         class="relative w-full max-w-2xl mx-auto rounded-2xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-soft p-5">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold">Kitabı Düzenle</h3>
        <button class="text-gray-500 hover:text-gray-700 dark:hover:bg-gray-700" @click="closeEdit()">✕</button>
      </div>

      <div class="grid sm:grid-cols-2 gap-3">
        <input x-model="edit.model.title" placeholder="Başlık *"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        <input x-model="edit.model.author" placeholder="Yazar"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">

        <input x-model.number="edit.model.total_pages" type="number" min="1" placeholder="Toplam sayfa *"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        <input x-model="edit.model.category" placeholder="Kategori"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">

        <input x-model="edit.model.cover_url" placeholder="Kapak URL"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        <input x-model="edit.model.tags" placeholder="Etiketler (virgülle)"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">

        <input x-model="edit.model.started_at" type="date" placeholder="Başlangıç"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">

        <div class="flex items-center gap-2 px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700">
          <input id="edit_is_finished" type="checkbox" x-model="edit.model.is_finished" class="h-4 w-4">
          <label for="edit_is_finished" class="text-sm select-none">Bitti</label>
        </div>

        <input x-model.number="edit.model.current_page" type="number" min="0" :max="edit.model.total_pages||0" placeholder="Şu anki sayfa"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        <input x-model="edit.model.finished_at" type="date" placeholder="Bitiş"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600"
               :disabled="!edit.model.is_finished">
        <input x-model.number="edit.model.rating" type="number" min="0" max="100" step="1" placeholder="Puan (0-100)"
               :disabled="!edit.model.is_finished"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">

        <div class="flex items-center gap-2 px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700">
          <input id="edit_favorite" type="checkbox" x-model="edit.model.favorite" class="h-4 w-4">
          <label for="edit_favorite" class="text-sm select-none">Favori</label>
        </div>
      </div>

      <textarea x-model="edit.model.notes" rows="3" placeholder="Notlar"
                class="mt-3 w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600"></textarea>

      <div class="mt-4 flex items-center justify-end gap-3">
        <button class="px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700" @click="closeEdit()">İptal</button>
        <button class="px-4 py-2 rounded-lg bg-brand-600 text-white hover:opacity-95" @click="saveEdit()">Kaydet</button>
      </div>
    </div>
  </div>

  <script src="/static/admin/js/app.js"></script>
  <script defer src="/static/admin/js/header.js"></script>
</body>
</html>
