<!DOCTYPE html>

<html lang="tr" class="h-full">

<head>

  <meta charset="utf-8"/>

  <meta name="viewport" content="width=device-width,initial-scale=1"/>

  <title>Book - Günlük</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <link rel="stylesheet" href="/static/admin/css/custom.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox.css"/>

  <script>

    tailwind.config = {

      darkMode: 'class',

      theme: { extend: {

        colors: { brand: { 600: '#4f46e5' } },

        boxShadow: { soft: '0 8px 30px rgba(0,0,0,.08)' }

      } }

    }

  </script>

  <script defer src="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox.umd.js"></script>

  <script>

    (function(){

      if(!localStorage.getItem('token')){

        window.location.replace('/static/admin/login.html');

      }

    })();

  </script>

</head>

<body class="h-full bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100" x-data="diaryPage()" x-init="init()">

  <div id="toast-root" class="fixed top-4 right-4 z-50 space-y-2"></div>

  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

    <div id="site-header" data-active="books"></div>

    <template x-if="loading">

      <div class="p-10 text-center text-gray-500">Yükleniyor…</div>

    </template>

    <template x-if="!loading && book">

      <div class="space-y-8">

        <div class="bg-white dark:bg-gray-800 shadow-soft rounded-3xl overflow-hidden border border-indigo-200 dark:border-indigo-700">

          <div class="bg-gradient-to-r from-indigo-100 via-indigo-50 to-white dark:from-gray-800 dark:via-gray-900 dark:to-gray-900 px-6 py-8">
            <div class="flex flex-col gap-8 lg:flex-row lg:items-start lg:justify-between">

              <div class="flex flex-col gap-6 lg:flex-row lg:flex-1 lg:items-start">

                <div class="relative flex-shrink-0">
                  <a :href="book.cover_url || '/static/admin/images/placeholder-book.png'"
                     data-fancybox="cover"
                     class="group relative block w-40 sm:w-48 lg:w-56 overflow-hidden rounded-2xl border border-indigo-200/70 dark:border-indigo-700/70 shadow-lg">
                    <img :src="book.cover_url || '/static/admin/images/placeholder-book.png'"
                         alt="Kapak"
                         class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-[1.04]"/>
                    <span class="pointer-events-none absolute inset-x-0 bottom-0 flex items-center justify-between bg-gradient-to-t from-black/70 via-black/15 to-transparent px-4 py-3 text-xs text-white">
                      <!-- <span class="font-medium" x-text="(book.total_pages || 0) + ' sayfa'"></span> -->
                      <span class="inline-flex items-center gap-1 text-[11px] uppercase tracking-wide">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
                          <path d="M3 6a3 3 0 013-3h5a3 3 0 013 3v1h1a3 3 0 013 3v8a3 3 0 01-3 3h-9a3 3 0 01-3-3V6zm6 1V6a1 1 0 011-1h1a1 1 0 011 1v1h-3zm2.293 4.293a1 1 0 10-1.414 1.414L11.172 13l-1.293 1.293a1 1 0 101.414 1.414L12.586 14l1.293 1.293a1 1 0 001.414-1.414L14 13l1.293-1.293a1 1 0 00-1.414-1.414L12.586 11l-1.293-1.293z"/>
                        </svg>
                        <span>Yakınlaştır</span>
                      </span>
                    </span>
                  </a>
                </div>

                <div class="space-y-4 flex-1">

                  <div class="space-y-2">
                    <h1 class="text-2xl sm:text-3xl font-semibold text-indigo-900 dark:text-indigo-100" x-text="book.title"></h1>
                    <p class="text-sm text-indigo-700 dark:text-indigo-200" x-text="book.author || 'Bilinmeyen Yazar'"></p>
                  </div>

                  <div class="flex flex-wrap items-center gap-2 text-xs text-indigo-700 dark:text-indigo-200">
                    <span class="inline-flex items-center gap-1 rounded-full border border-indigo-200/60 bg-white/80 px-2.5 py-1 font-medium dark:border-indigo-700/70 dark:bg-gray-900/60" x-text="book.category || 'Kategori yok'"></span>
                  </div>

                  <template x-if="book.started_at">
                    <div class="flex flex-wrap items-center gap-2 text-xs text-indigo-700 dark:text-indigo-200">
                      <span class="inline-flex items-center gap-2 rounded-full border border-indigo-200/60 bg-white/80 px-2.5 py-1 dark:border-indigo-700/70 dark:bg-gray-900/60">
                        <span>Başlangıç: <span x-text="fmtDate(book.started_at)"></span></span>
                        <template x-if="book.finished_at">
                          <span class="inline-flex items-center gap-2">
                            <span class="h-1 w-1 rounded-full bg-indigo-400"></span>
                            <span>Bitiş: <span x-text="fmtDate(book.finished_at)"></span></span>
                          </span>
                        </template>
                      </span>
                    </div>
                  </template>

                  <template x-if="book.tags">
                    <div class="flex flex-wrap gap-2 pt-2">
                      <template x-for="tag in (book.tags || '').split(',').map(t => t.trim()).filter(Boolean)" :key="tag">
                        <span class="text-[11px] uppercase tracking-wide rounded-full bg-indigo-200/70 px-2 py-0.5 text-indigo-800 dark:bg-indigo-600/30 dark:text-indigo-200" x-text="tag"></span>
                      </template>
                    </div>
                  </template>

                  <div x-show="book.notes" class="rounded-xl border border-white/50 bg-white/80 p-4 shadow-sm dark:border-indigo-800/60 dark:bg-gray-900/60">
                    <p class="text-xs uppercase tracking-wide text-indigo-500 dark:text-indigo-300">Notlar</p>
                    <p class="mt-2 text-sm leading-relaxed text-indigo-900 dark:text-indigo-100" x-text="book.notes"></p>
                  </div>

                </div>

              </div>

              <div class="flex flex-col gap-5 lg:w-72">

                <div class="flex items-center justify-end gap-2" @click.away="closeActionMenu()" @keydown.escape.window="closeActionMenu()">
                  <button type="button"
                          class="relative inline-flex h-10 w-10 items-center justify-center rounded-full border border-indigo-200/70 dark:border-indigo-700/80 bg-white/80 dark:bg-gray-900/60 shadow-sm transition hover:scale-[1.04] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600"
                          :class="book._favAnim ? 'scale-[1.12]' : ''"
                          :title="book.favorite ? 'Favoriden çıkar' : 'Favoriye ekle'"
                          @click="toggleFavorite()"
                          :disabled="book._favBusy"
                          :aria-pressed="book.favorite">
                    <span class="absolute inset-0 rounded-full pointer-events-none" x-show="book._favAnim" x-transition.opacity style="box-shadow:0 0 0 6px rgba(244,63,94,0.2);"></span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transition-colors duration-150"
                         :class="book.favorite ? 'text-rose-500' : 'text-slate-400'"
                         viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                      <path x-show="book.favorite" x-transition
                            d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.198 3 12.74 3 10.25 3 7.75 4.99 6 7.318 6 8.83 6 10.273 6.802 11 8.027 11.727 6.802 13.17 6 14.682 6 17.01 6 19 7.75 19 10.25c0 2.49-1.688 4.948-3.989 7.257a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.218l-.022.012-.007.003a.75.75 0 01-.666 0z"/>
                      <path x-show="!book.favorite" x-transition fill="none" stroke="currentColor" stroke-width="1.8"
                            d="M12 21s-7-4.35-7-10.5A4.5 4.5 0 0 1 9.5 6c1.54 0 2.82.74 3.5 1.88C13.68 6.74 14.96 6 16.5 6A4.5 4.5 0 0 1 19 10.5C19 16.65 12 21 12 21z"/>
                    </svg>
                  </button>

                  <div class="relative" x-cloak>
                    <button type="button"
                            class="inline-flex h-10 w-10 items-center justify-center rounded-full border border-indigo-200/70 bg-white/80 text-indigo-600 shadow-sm transition hover:bg-white dark:border-indigo-700/80 dark:bg-gray-900/60 dark:text-indigo-200"
                            @click="toggleActionMenu()"
                            :aria-expanded="actionMenuOpen">
                      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M10 3a1.5 1.5 0 110 3 1.5 1.5 0 010-3zm0 5.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3zm0 5.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3z"/>
                      </svg>
                    </button>

                    <div style="z-index: 20" x-show="actionMenuOpen" x-transition.origin.top.right class="absolute right-0 mt-2 w-44 rounded-xl border border-indigo-200/70 bg-white/95 p-2 text-sm shadow-lg backdrop-blur dark:border-indigo-700/70 dark:bg-gray-900/90">
                      <button type="button" class="flex w-full items-center gap-2 rounded-lg px-3 py-2 text-indigo-700 transition hover:bg-indigo-50 dark:text-indigo-100 dark:hover:bg-gray-800" @click="closeActionMenu(); openEdit()">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 3.487l3.651 3.651M4 20h4.5l10.5-10.5-4.5-4.5L4 15.5V20z"/>
                        </svg>
                        Düzenle
                      </button>
                      <button type="button" class="flex w-full items-center gap-2 rounded-lg px-3 py-2 text-rose-600 transition hover:bg-rose-50 dark:text-rose-400 dark:hover:bg-gray-800" @click="closeActionMenu(); removeBook()">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M9 3h6l1 3h4M5 6h14M9 9v8m6-8v8M6 6h12l-1 14a2 2 0 01-2 2H9a2 2 0 01-2-2L6 6z"/>
                        </svg>
                        Sil
                      </button>
                    </div>
                  </div>
                </div>

                <div class="rounded-2xl border border-white/40 bg-white/85 p-5 shadow-soft backdrop-blur dark:border-indigo-800/60 dark:bg-gray-900/70">
                  <div class="flex items-start justify-between gap-4">
                    <div class="space-y-1">
                      <p class="text-xs uppercase tracking-wide text-indigo-500 dark:text-indigo-300">Okuma ilerlemesi</p>
                      <p class="text-2xl font-semibold text-indigo-900 dark:text-indigo-100" x-text="pagesProgressLabel()"></p>
                    </div>
                    <span class="px-3 py-1 rounded-full text-xs font-medium" :class="book.is_finished ? 'bg-emerald-500/20 text-emerald-700' : 'bg-indigo-500/20 text-indigo-700 dark:text-indigo-200'">
                      <span x-text="book.is_finished ? 'Bitti' : 'Devam'"></span>
                    </span>
                  </div>
                  <div class="mt-4 space-y-2">
                    <div class="h-2 w-full overflow-hidden rounded-full bg-indigo-200/60 dark:bg-indigo-900/40">
                      <div class="h-full rounded-full bg-indigo-500 transition-all duration-500" :style="`width: ${progressPercent()}%`"></div>
                    </div>
                    <p class="text-xs text-indigo-600 dark:text-indigo-300" x-text="progressPercent() + '% tamamlandı'"></p>
                  </div>
                </div>

                <template x-if="book.rating !== null && book.rating !== undefined">
                  <div class="rounded-2xl border border-white/40 bg-white/90 p-5 shadow-soft backdrop-blur dark:border-indigo-800/60 dark:bg-gray-900/70">
                    <p class="text-xs uppercase tracking-wide text-indigo-500 dark:text-indigo-300">Puan</p>
                    <div class="mt-3 flex items-center gap-4">
                      <span class="flex h-12 w-12 items-center justify-center rounded-full bg-indigo-500/15 text-2xl text-indigo-600 dark:bg-indigo-500/20 dark:text-indigo-200">&#9733;</span>
                      <div class="flex items-baseline gap-2">
                        <span class="text-3xl font-semibold text-indigo-900 dark:text-indigo-100" x-text="book.rating"></span>
                        <span class="text-sm text-indigo-500 dark:text-indigo-300">/100</span>
                      </div>
                    </div>
                  </div>
                </template>

              </div>

            </div>
          </div>

        </div>

        <section class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">

          <div class="rounded-2xl border border-indigo-200 dark:border-indigo-700 bg-white/90 dark:bg-gray-800/80 shadow-sm p-4">

            <p class="text-xs uppercase tracking-wide text-indigo-500 dark:text-indigo-300 font-semibold">Okuma Günleri</p>

            <p class="mt-2 text-2xl font-semibold text-indigo-900 dark:text-indigo-100" x-text="metrics.days || 0"></p>

            <p class="text-xs text-indigo-600 dark:text-indigo-300 mt-1">Gün boyunca kayıt tutulmuş.</p>

          </div>

          <div class="rounded-2xl border border-indigo-200 dark:border-indigo-700 bg-white/90 dark:bg-gray-800/80 shadow-sm p-4">

            <p class="text-xs uppercase tracking-wide text-indigo-500 dark:text-indigo-300 font-semibold">Sayfa ilerlemesi</p>

            <p class="mt-2 text-2xl font-semibold text-indigo-900 dark:text-indigo-100" x-text="pagesProgressLabel()"></p>

            <p class="text-xs text-indigo-600 dark:text-indigo-300 mt-1" x-text="'Okunan sayfa: ' + pagesReadValue().toLocaleString('tr-TR')"></p>

          </div>

          <div class="rounded-2xl border border-indigo-200 dark:border-indigo-700 bg-white/90 dark:bg-gray-800/80 shadow-sm p-4">

            <p class="text-xs uppercase tracking-wide text-indigo-500 dark:text-indigo-300 font-semibold">Not Sayısı</p>

            <p class="mt-2 text-2xl font-semibold text-indigo-900 dark:text-indigo-100" x-text="metrics.notes || 0"></p>

            <p class="text-xs text-indigo-600 dark:text-indigo-300 mt-1">Anlamlı not bulunan kayıtlar.</p>

          </div>

          <div class="rounded-2xl border border-indigo-200 dark:border-indigo-700 bg-white/90 dark:bg-gray-800/80 shadow-sm px-4 py-4 flex flex-col justify-between">

            <div>

              <p class="text-xs uppercase tracking-wide text-indigo-500 dark:text-indigo-300 font-semibold">Ortalama</p>

              <p class="mt-2 text-2xl font-semibold text-indigo-900 dark:text-indigo-100" x-text="averagePages() + ' sayfa/gün'"></p>

            </div>

            <p class="text-xs text-indigo-600 dark:text-indigo-300 mt-3">Dönem: <span x-text="readingSpan()"></span></p>

          </div>

        </section>

        <section class="bg-white/80 dark:bg-gray-800/80 rounded-3xl shadow-soft border border-indigo-200 dark:border-indigo-700 p-6">

          <header class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
            <div class="space-y-1">
              <h2 class="text-xl font-semibold text-indigo-900 dark:text-indigo-100">Okuma G&uuml;nl&uuml;&#287;&uuml;</h2>
              <p class="text-sm text-indigo-700 dark:text-indigo-200">Kitap boyunca tuttu&#287;un t&uuml;m notlar burada.</p>
            </div>
            <button type="button" class="inline-flex h-10 w-10 items-center justify-center self-start sm:self-auto rounded-full bg-brand-600 text-white shadow-sm hover:bg-brand-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600 transition"
                    @click="openAddLog()" title="Kay&#305;t Ekle">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14m7-7H5" />
              </svg>
              <span class="sr-only">Kay&#305;t Ekle</span>
            </button>
          </header>

          <template x-if="logs.length === 0">

            <div class="p-10 text-center text-indigo-500 dark:text-indigo-200 border border-dashed border-indigo-200 rounded-2xl">

              Henüz günlük kaydi yok.

            </div>

          </template>

          <div class="relative" x-show="logs.length > 0">

            <div class="absolute left-4 sm:left-1/2 sm:-translate-x-1/2 top-0 bottom-0 border-l-2 border-indigo-100 dark:border-indigo-700"></div>

            <div class="space-y-8">

              <template x-for="log in logs" :key="log.id">

                <article class="relative sm:w-1/2" :class="log._side === 'left' ? 'sm:ml-0 sm:mr-auto sm:pl-0 sm:pr-10' : 'sm:ml-auto sm:mr-0 sm:pl-10 sm:pr-0'">

                  <div class="absolute left-4 sm:left-1/2 sm:-translate-x-1/2 top-2 h-4 w-4 rounded-full border-2 border-white dark:border-gray-900 bg-indigo-500 shadow transition-transform" :class="log._side === 'left' ? 'sm:-ml-5' : 'sm:ml-5'"></div>

                  <div class="rounded-2xl border border-indigo-200 dark:border-indigo-700 bg-white/90 dark:bg-gray-900/80 backdrop-blur shadow-sm p-5 space-y-3">

                    <div class="flex items-start justify-between gap-3">
                      <div class="space-y-1">
                        <div class="text-sm font-semibold text-indigo-800 dark:text-indigo-100" x-text="fmtDate(log.log_date)"></div>
                        <div class="flex items-center gap-2 text-xs text-indigo-600 dark:text-indigo-300">
                          <span x-show="Number(log.pages_read||0) > 0" class="px-2 py-0.5 rounded-full bg-indigo-100 dark:bg-indigo-500/30" x-text="'+' + log.pages_read + ' sayfa'"></span>
                          <span x-show="log.finished" class="inline-flex items-center gap-1 text-emerald-600">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor">
                              <path fill-rule="evenodd" d="M16.704 4.153a.75.75 0 010 1.06l-7.499 7.5a.75.75 0 01-1.061 0L3.296 7.864a.75.75 0 111.06-1.06l4.048 4.047 6.97-6.97a.75.75 0 011.06 0z" clip-rule="evenodd" />
                            </svg>
                            Bitti
                          </span>
                        </div>
                      </div>
                      <div class="inline-flex items-center gap-2 text-indigo-500 dark:text-indigo-200">
                        <button type="button" class="inline-flex h-8 w-8 items-center justify-center rounded-full border border-indigo-200 dark:border-indigo-600 hover:bg-indigo-100 dark:hover:bg-indigo-600/40 transition"
                                @click.stop="openEditLog(log)" title="D&uuml;zenle">
                          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M13.586 2.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793z" />
                            <path d="M11.379 4.793L3 13.172V17h3.828l8.38-8.379-3.83-3.828z" />
                          </svg>
                          <span class="sr-only">D&uuml;zenle</span>
                        </button>
                        <button type="button" class="inline-flex h-8 w-8 items-center justify-center rounded-full border border-red-200 text-red-500 hover:bg-red-100 dark:border-red-600 dark:text-red-300 dark:hover:bg-red-600/30 transition"
                                @click.stop="deleteLog(log)" title="Sil">
                          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M8.75 2a1 1 0 00-.894.553L7.382 3H4.75a.75.75 0 000 1.5h.392l.791 11.066A2.25 2.25 0 008.176 18.75h3.648a2.25 2.25 0 002.243-2.184l.791-11.066h.392a.75.75 0 000-1.5h-2.632l-.474-.894A1 1 0 0011.25 2h-2.5zM9 8.75a.75.75 0 011.5 0v6a.75.75 0 01-1.5 0v-6zm4.25 0a.75.75 0 00-1.5 0v6a.75.75 0 001.5 0v-6zM6.25 8.75a.75.75 0 011.5 0v6a.75.75 0 01-1.5 0v-6z" clip-rule="evenodd" />
                          </svg>
                          <span class="sr-only">Sil</span>
                        </button>
                      </div>
                    </div>

                    <p class="text-sm text-indigo-800 dark:text-indigo-100 whitespace-pre-line" x-text="log.note || 'Not eklenememi&#351;.'"></p>

                  </div>

                </article>

              </template>

            </div>

          </div>

        </section>

      </div>

    </template>

  </div>

  <script>

    function todayStr(){
      const d = new Date();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      return `${d.getFullYear()}-${m}-${day}`;
    }

    function diaryPage(){

      return {

        isDark: localStorage.getItem('theme') === 'dark',

        loading: true,

        book: null,

        logs: [],

        metrics: { days: 0, notes: 0, pages: 0, first: null, last: null },

        logModal: {
          open: false,
          mode: 'add',
          id: null,
          form: { log_date: todayStr(), pages_read: 1, note: '', finished: false }
        },
        saveLogBusy: false,
        actionMenuOpen: false,

        edit: {
          open: false,
          id: null,
          model: {
            title: '',
            author: '',
            total_pages: 0,
            cover_url: '',
            category: '',
            tags: '',
            started_at: '',
            finished_at: '',
            is_finished: false,
            current_page: 0,
            notes: '',
            favorite: false,
            rating: null
          }
        },

        id: null,

        init(){

          document.documentElement.classList.toggle('dark', this.isDark);

          window.__onThemeToggle = (next) => { this.isDark = next; };

          const params = new URLSearchParams(window.location.search);

          this.id = params.get('id');

          if(!this.id){

            window.location.replace('/static/admin/books.html');

            return;

          }

          this.load();

          this.$watch('edit.model.is_finished', (val) => {
            if(!val) this.edit.model.rating = null;
          });

          this.$watch('logModal.form.finished', (val) => {
            if(!val) return;
            if(this.logModal.mode !== 'add') return;
            const rem = this.remainingPages();
            if(rem > 0) this.logModal.form.pages_read = String(rem);
          });

        },

        async load(){

          this.loading = true;

          try {

            const [bookRes, logsRes] = await Promise.all([

              api('/api/books/' + this.id),

              api('/api/logs?book_id=' + this.id)

            ]);

            if(!bookRes.ok) throw new Error('Kitap alinamadi');

            if(!logsRes.ok) throw new Error('Günlük alinamadi');

            this.book = await bookRes.json();
            if(this.book){
              const parsedRating = Number(this.book.rating);
              this.book.rating = Number.isFinite(parsedRating) ? parsedRating : null;
              this.book.favorite = !!this.book.favorite;
              this.book._favBusy = false;
              this.book._favAnim = false;
            }

            const raw = await logsRes.json();

            const rows = Array.isArray(raw) ? raw : [];

            this.logs = rows.map((log, idx) => ({

              ...log,

              _side: idx % 2 === 0 ? 'left' : 'right'

            }));

            const uniqueDays = new Set(rows.map(log => log.log_date)).size;

            const noteCount = rows.filter(log => (log.note || '').trim().length > 0).length;

            const totalPages = rows.reduce((sum, log) => sum + Number(log.pages_read || 0), 0);

            const first = rows.length > 0 ? rows[rows.length - 1].log_date : this.book?.started_at || null;

            const last = rows.length > 0 ? rows[0].log_date : this.book?.finished_at || null;

            this.metrics = { days: uniqueDays, notes: noteCount, pages: totalPages, first, last };
            this.actionMenuOpen = false;

          } catch (err) {

            alert(err.message || err);

          } finally {

            this.loading = false;

          }

        },

        pagesProgress(){
          const total = Number(this.book?.total_pages || 0);
          const fromLogs = Number(this.metrics.pages || 0);
          const fallback = Number(this.book?.current_page || 0);
          const read = fromLogs > 0 ? fromLogs : (this.book?.is_finished ? total : fallback);
          const safeRead = Number.isFinite(read) ? read : 0;
          const safeTotal = Number.isFinite(total) ? total : 0;
          return { read: safeRead, total: safeTotal };
        },

        pagesProgressLabel(){
          const { read, total } = this.pagesProgress();
          const readStr = read.toLocaleString('tr-TR');
          const totalStr = total.toLocaleString('tr-TR');
          return `${readStr} / ${totalStr} sayfa`;
        },

        pagesReadValue(){
          const { read } = this.pagesProgress();
          return read;
        },

        progressPercent(){
          const { read, total } = this.pagesProgress();
          if(!total) return 0;
          const ratio = (read / total) * 100;
          return Math.max(0, Math.min(100, Math.round(ratio)));
        },

        openEdit(){
          if(!this.book) return;
          this.closeActionMenu();
          const normalizeDate = (value) => {
            if(!value) return '';
            return String(value).split('T')[0] || '';
          };
          const b = this.book;
          this.edit.open = true;
          this.edit.id = b.id;
          this.edit.model = {
            title: b.title || '',
            author: b.author || '',
            total_pages: Number(b.total_pages || 0),
            cover_url: b.cover_url || '',
            category: b.category || '',
            tags: b.tags || '',
            started_at: normalizeDate(b.started_at),
            finished_at: normalizeDate(b.finished_at),
            is_finished: !!b.is_finished,
            current_page: Number(b.current_page || 0),
            notes: b.notes || '',
            favorite: !!b.favorite,
            rating: typeof b.rating === 'number' ? b.rating : null
          };
        },

        closeEdit(){
          this.edit.open = false;
          this.edit.id = null;
        },

        async saveEdit(){
          const m = this.edit.model;
          if(!m.title.trim()){
            alert('Baslik gerekli');
            return;
          }
          if(Number(m.total_pages || 0) <= 0){
            alert('Toplam sayfa birden büyük olmali');
            return;
          }
          if(Number(m.current_page || 0) > Number(m.total_pages || 0)){
            alert('Şu anki sayfa toplamdan büyük olamaz');
            return;
          }
          const ratingNum = Number(m.rating);
          const payload = {
            title: m.title.trim(),
            author: m.author?.trim() || null,
            total_pages: Number(m.total_pages || 0),
            cover_url: m.cover_url?.trim() || null,
            category: m.category?.trim() || null,
            tags: m.tags?.trim() || null,
            started_at: m.started_at || null,
            finished_at: m.finished_at || null,
            is_finished: !!m.is_finished,
            current_page: Number(m.current_page || 0),
            notes: m.notes?.trim() || null,
            favorite: !!m.favorite,
            rating: m.is_finished && !Number.isNaN(ratingNum) ? Math.max(0, Math.min(100, ratingNum)) : null
          };
          try {
            const res = await api(`/api/books/${this.edit.id}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            if(!res.ok) throw new Error(await res.text() || 'Kitap güncellenemedi');
            this.closeEdit();
            await this.load();
          } catch (err) {
            alert(err.message || err);
          }
        },

        async removeBook(){
          if(!this.book) return;
          this.closeActionMenu();
          if(!confirm('Bu kitabi silmek istiyor musun? Bu islem geri alinamaz.')) return;
          try {
            const res = await api(`/api/books/${this.book.id}`, { method: 'DELETE' });
            if(!res.ok) throw new Error(await res.text() || 'Kitap silinemedi');
            alert('Kitap silindi');
            window.location.replace('/static/admin/books.html');
          } catch (err) {
            alert(err.message || err);
          }
        },

        async toggleFavorite(){
          if(!this.book) return;
          if(this.book._favBusy) return;
          this.book._favBusy = true;

          const prev = !!this.book.favorite;
          this.book.favorite = !prev;
          this.book._favAnim = true;
          setTimeout(() => { if(this.book) this.book._favAnim = false; }, 300);

          try {
            const res = await api(`/api/books/${this.book.id}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ favorite: this.book.favorite })
            });
            if(!res.ok){
              const txt = await res.text();
              throw new Error(txt || 'Favori güncellenemedi');
            }
          } catch (err) {
            if(this.book) this.book.favorite = prev;
            alert(err.message || err);
          } finally {
            if(this.book) this.book._favBusy = false;
          }
        },

        toggleActionMenu(){
          this.actionMenuOpen = !this.actionMenuOpen;
        },

        closeActionMenu(){
          this.actionMenuOpen = false;
        },

        openAddLog(){
          this.logModal.mode = 'add';
          this.logModal.id = null;
          this.logModal.form = { log_date: todayStr(), pages_read: '', note: '', finished: false };
          this.logModal.open = true;
        },

        openEditLog(log){
          if(!log) return;
          const datePart = (log.log_date || '').split('T')[0] || todayStr();
          this.logModal.mode = 'edit';
          this.logModal.id = log.id;
          this.logModal.form = {
            log_date: datePart,
            pages_read: log.pages_read ? String(log.pages_read) : '',
            note: log.note || '',
            finished: !!log.finished
          };
          this.logModal.open = true;
        },

        closeLogModal(){
          this.logModal.open = false;
          this.logModal.id = null;
          this.logModal.mode = 'add';
        },

        async saveLog(){
          const f = this.logModal.form;
          if(!f.log_date){ alert('Tarih gerekli'); return; }
          const numericPages = Number(f.pages_read);
          const hasPages = Number.isFinite(numericPages) && numericPages > 0;
          const hasNote = (f.note || '').trim().length > 0;
          const rawPageValue = ((f.pages_read ?? '') + '').trim();
          const hasRawPages = rawPageValue.length > 0;
          if(hasRawPages && (!Number.isFinite(numericPages) || numericPages < 0)){
            alert('Sayfa sayisi pozitif bir sayi olmali');
            return;
          }
          if(!hasPages && !hasNote){
            alert('En azindan sayfa sayisi veya not girmelisiniz');
            return;
          }
          if(f.finished && !hasPages){
            alert('Kitabi bitirdim isaretliyorsan okuduğun sayfayi da gir');
            return;
          }

          this.saveLogBusy = true;
          try {
            if(f.finished && this.logModal.mode === 'add'){
              const rem = this.remainingPages();
              if(rem > 0) f.pages_read = String(rem);
            }

            const payload = {
              log_date: f.log_date,
              pages_read: hasPages ? numericPages : 0,
              note: hasNote ? f.note.trim() : null,
              finished: !!f.finished
            };

            if(this.logModal.mode === 'add'){
              const res = await api('/api/logs', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  book_id: this.book.id,
                  ...payload
                })
              });
              if(!res.ok) throw new Error(await res.text() || 'Kayit eklenemedi');
            } else {
              const res = await api(`/api/logs/${this.logModal.id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
              if(!res.ok) throw new Error(await res.text() || 'Kayit güncellenemedi.');
            }

            this.closeLogModal();
            await this.load();
          } catch (err) {
            alert(err.message || err);
          } finally {
            this.saveLogBusy = false;
          }
        },

        async deleteLog(log){
          if(!log) return;
          if(!confirm('Kayit silinsin mi?')) return;
          try {
            const res = await api(`/api/logs/${log.id}`, { method: 'DELETE' });
            if(!res.ok) throw new Error(await res.text() || 'Kayit silinemedi');
            await this.load();
          } catch (err) {
            alert(err.message || err);
          }
        },

        remainingPages(){
          if(!this.book) return 0;
          const total = Number(this.book.total_pages || 0);
          const current = this.book.is_finished ? total : Number(this.book.current_page || 0);
          const rem = total - current;
          return rem > 0 ? rem : 0;
        },

        readingSpan(){

          const { first, last } = this.metrics;

          if(first && last){

            if(first === last) return this.fmtDate(first);

            return `${this.fmtDate(first)} → ${this.fmtDate(last)}`;

          }

          if(last) return this.fmtDate(last);

          if(first) return this.fmtDate(first);

          return '—';

        },

        averagePages(){

          if(!this.metrics.days) return 0;

          return Math.round(this.metrics.pages / this.metrics.days);

        },

        fmtDate(v){

          if(!v) return '-';

          const pr = String(v).split('T')[0].split('-');

          if(pr.length === 3){

            const [y,m,d] = pr;

            return `${d}.${m}.${y}`;

          }

          const d = new Date(v);

          if(Number.isNaN(d.getTime())) return v;

          return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;

        }

      };

    }

  </script>

  <div x-show="edit.open" x-transition.opacity class="fixed inset-0 z-50 flex items-center justify-center">
    <div class="absolute inset-0 bg-black/50" @click="closeEdit()"></div>
    <div @keydown.escape.window="closeEdit()"
         class="relative w-full max-w-2xl mx-auto rounded-2xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-soft p-5">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100">Kitabi Duzenle</h3>
        <button type="button" class="inline-flex h-8 w-8 items-center justify-center rounded-full text-gray-500 hover:bg-gray-100 hover:text-gray-700 dark:text-gray-300 dark:hover:bg-gray-700/60" @click="closeEdit()" title="Kapat">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M5.293 5.293a1 1 0 011.414 0L10 8.586l3.293-3.293a1 1 0 111.414 1.414L11.414 10l3.293 3.293a1 1 0 01-1.414 1.414L10 11.414l-3.293 3.293a1 1 0 01-1.414-1.414L8.586 10 5.293 6.707a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
          <span class="sr-only">Kapat</span>
        </button>
      </div>

      <div class="grid sm:grid-cols-2 gap-3">
        <input x-model="edit.model.title" placeholder="Baslik *"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        <input x-model="edit.model.author" placeholder="Yazar"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">

        <input x-model.number="edit.model.total_pages" type="number" min="1" placeholder="Toplam Sayfa *"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        <input x-model="edit.model.category" placeholder="Kategori"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">

        <input x-model="edit.model.cover_url" placeholder="Kapak URL"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        <input x-model="edit.model.tags" placeholder="Etiketler (virgülle)"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">

        <input x-model="edit.model.started_at" type="date" placeholder="Baslangiç"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">

        <input x-model="edit.model.finished_at" type="date" placeholder="Bitis"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600"
               :disabled="!edit.model.is_finished">

        <input x-model.number="edit.model.current_page" type="number" min="0" :max="edit.model.total_pages||0" placeholder="Şu anki sayfa"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        <input x-model.number="edit.model.rating" type="number" min="0" max="100" step="1" placeholder="Puan (0-100)"
               :disabled="!edit.model.is_finished"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">

        <div class="flex items-center gap-2 px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700">
          <input id="edit_is_finished" type="checkbox" x-model="edit.model.is_finished" class="h-4 w-4">
          <label for="edit_is_finished" class="text-sm select-none">Bitti</label>
        </div>
      </div>

      <textarea x-model="edit.model.notes" rows="3" placeholder="Notlar"
                class="mt-3 w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600"></textarea>

      <div class="mt-4 flex items-center justify-end gap-3">
        <button type="button" class="px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700" @click="closeEdit()">İptal</button>
        <button type="button" class="px-4 py-2 rounded-lg bg-brand-600 text-white hover:opacity-95" @click="saveEdit()">Kaydet</button>
      </div>
    </div>
  </div>

  <div x-show="logModal.open" x-transition.opacity class="fixed inset-0 z-50 flex items-center justify-center">
    <div class="absolute inset-0 bg-black/50" @click="closeLogModal()"></div>
    <div @keydown.escape.window="closeLogModal()"
         class="relative w-full max-w-lg mx-auto rounded-2xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-soft p-5">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold" x-text="logModal.mode === 'edit' ? 'Kayıt Düzenle' : 'Kayıt Ekle'"></h3>
        <button type="button" class="inline-flex h-8 w-8 items-center justify-center rounded-full text-gray-500 hover:bg-gray-100 hover:text-gray-700 dark:text-gray-300 dark:hover:bg-gray-700/60" @click="closeLogModal()" title="Kapat">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M5.293 5.293a1 1 0 011.414 0L10 8.586l3.293-3.293a1 1 0 111.414 1.414L11.414 10l3.293 3.293a1 1 0 01-1.414 1.414L10 11.414l-3.293 3.293a1 1 0 01-1.414-1.414L8.586 10 5.293 6.707a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
          <span class="sr-only">Kapat</span>
        </button>
      </div>

      <div class="grid sm:grid-cols-2 gap-3">
        <label class="block">
          <span class="text-sm">Tarih <span class="text-red-500">*</span></span>
          <input type="date" x-model="logModal.form.log_date"
                 class="mt-1 w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        </label>

        <label class="block">
          <span class="text-sm">Okunan Sayfa</span>
          <input type="number" min="1" x-model="logModal.form.pages_read" :disabled="logModal.form.finished" placeholder="Örnek: 30"
                 class="mt-1 w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        </label>

        <label class="block sm:col-span-2">
          <span class="text-sm">Not</span>
          <textarea rows="3" x-model="logModal.form.note" placeholder="Kısaca nasıldı?"
                    class="mt-1 w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600"></textarea>
        </label>

        <label class="inline-flex items-center gap-2 sm:col-span-2">
          <input type="checkbox" x-model="logModal.form.finished" class="h-4 w-4">
          <span class="text-sm select-none">Kitabı bitirdim</span>
        </label>
      </div>

      <div class="mt-4 flex items-center justify-end gap-3">
        <button type="button" class="px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700" @click="closeLogModal()">İptal</button>
        <button type="button" class="px-4 py-2 rounded-lg bg-brand-600 text-white hover:opacity-95 disabled:opacity-60 disabled:cursor-not-allowed"
                :disabled="saveLogBusy" @click="saveLog()">Kaydet</button>
      </div>
    </div>
  </div>

  <script src="/static/admin/js/app.js"></script>

  <script defer src="/static/admin/js/header.js"></script>

</body>

</html>
