<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Book — Detay</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/admin/css/custom.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"/>

  <script>
    tailwind.config = {
      darkMode:'class',
      theme:{ extend:{
        colors:{ brand:{600:'#4f46e5'} },
        boxShadow:{soft:'0 8px 30px rgba(0,0,0,.08)'}
      } }
    }
  </script>

  <!-- token yoksa login'e -->
  <script>
    (function(){
      if(!localStorage.getItem('token')){
        window.location.replace('/static/admin/login.html');
      }
    })();
  </script>

  <!-- Bu sayfaya özel Alpine state -->
  <script>
    // URL param oku
    function qp(name){ const u=new URL(location.href); return u.searchParams.get(name); }
    // Bugünün YYYY-MM-DD
    function todayStr(){
      const d=new Date();
      const m=String(d.getMonth()+1).padStart(2,'0');
      const day=String(d.getDate()).padStart(2,'0');
      return `${d.getFullYear()}-${m}-${day}`;
    }

    function bookPage(){
      return {
        isDark: localStorage.getItem('theme')==='dark',
        loading: true,
        user: null,
        book: null,

        // LOG state
        logsLoading: false,
        logs: [],
        logModal: {
          open:false,
          mode:'add', // add | edit
          id:null,
          form:{ log_date: todayStr(), pages_read:1, note:'', finished:false }
        },
        confirm: {
          open:false,
          title:'',
          message:'',
          confirmText:'Onayla',
          cancelText:'Vazgeç',
          variant:'danger',
          action:null,
          busy:false
        },

        // edit modal
        edit:{ open:false, id:null, model:{
          title:'', author:'', total_pages:0,
          cover_url:'', category:'', tags:'',
          started_at:'', finished_at:'', is_finished:false,
          current_page:0, notes:'', favorite:false, rating:null
        }},

        init(){
          document.documentElement.classList.toggle('dark', this.isDark);
          this.load();
          this.$watch('edit.model.is_finished', (val) => { if(!val) this.edit.model.rating = null; });

          // "Bitti" kutucuğu işaretlenirse kalan sayfayı otomatik yaz
          this.$watch('logModal.form.finished', (val) => {
            if(!val) return;
            if(this.logModal.mode !== 'add') return;
            const rem = this.remainingPages();
            if(rem > 0){
              this.logModal.form.pages_read = rem;
            }else{
              this.logModal.form.pages_read = Math.max(1, Number(this.logModal.form.pages_read) || 1);
            }
          });
        },

        toggleTheme(){
          this.isDark = !this.isDark;
          document.documentElement.classList.toggle('dark', this.isDark);
          localStorage.setItem('theme', this.isDark?'dark':'light');
        },

        async load(){
          try{
            const id = qp('id');
            if(!id){ location.replace('/static/admin/books.html'); return; }

            // kullanıcı
            let r = await api('/api/auth/me');
            if(!r.ok) throw new Error('auth');
            this.user = await r.json();

            // kitap
            r = await api('/api/books/'+id);
            if(!r.ok){
              // yoksa liste içinden bulmayı deneyelim (opsiyonel fallback)
              const all = await (await api('/api/books')).json();
              this.book = all.find(x=>String(x.id)===String(id)) || null;
              if(!this.book) throw new Error('Kitap bulunamadı');
            }else{
              this.book = await r.json();
            }

            if (this.book) {
              this.book.rating = typeof this.book.rating === 'number' ? this.book.rating : null;
            }

            // loglar
            await this.fetchLogs();

          }catch(e){
            alert(e.message||e);
            location.replace('/static/admin/books.html');
          }finally{
            this.loading = false;
          }
        },

        // --- LOGS ---
        async fetchLogs(){
          if(!this.book) return;
          this.logsLoading = true;
          try{
            const r = await api(`/api/logs?book_id=${this.book.id}`);
            if(!r.ok) throw new Error('Kayıtlar alınamadı');
            this.logs = await r.json(); // backend DESC sıralı gönderiyor
          }catch(e){ alert(e.message||e); }
          finally{ this.logsLoading=false; }
        },
        openAddLog(){
          this.logModal.mode='add';
          this.logModal.id=null;
          this.logModal.form={ log_date: todayStr(), pages_read:1, note:'', finished:false };
          this.logModal.open=true;
        },
        openEditLog(item){
          this.logModal.mode='edit';
          this.logModal.id=item.id;
          this.logModal.form={
            log_date: item.log_date,
            pages_read: Number(item.pages_read||1),
            note: item.note||'',
            finished: !!item.finished
          };
          this.logModal.open=true;
        },
        closeLogModal(){ this.logModal.open=false; this.logModal.id=null; },
        async saveLog(){
          const f=this.logModal.form;
          if(!f.log_date) return alert('Tarih gerekli');
          if(Number(f.pages_read||0)<=0) return alert('Okunan sayfa 1+ olmalı');

          try{
            if(this.logModal.mode==='add'){
              if(f.finished){
                const rem = this.remainingPages();
                if(rem > 0) f.pages_read = rem;
              }
              const r = await api('/api/logs', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({
                  book_id: this.book.id,
                  log_date: f.log_date,
                  pages_read: Number(f.pages_read),
                  note: f.note?.trim() || null,
                  finished: !!f.finished
                })
              });
              if(!r.ok) throw new Error(await r.text()||'Kayıt eklenemedi');

            }else{
              const r = await api(`/api/logs/${this.logModal.id}`, {
                method:'PUT',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({
                  log_date: f.log_date,
                  pages_read: Number(f.pages_read),
                  note: f.note?.trim() || null,
                  finished: !!f.finished
                })
              });
              if(!r.ok) throw new Error(await r.text()||'Kayıt güncellenemedi');
            }

            this.closeLogModal();
            await this.reloadBookAndLogs(); // kitap ilerleme & bitiş durumu tazelensin

          }catch(e){ alert(e.message||e); }
        },
        async deleteLog(item){
          if(!item) return;
          this.openConfirm({
            title: 'Kaydı Sil',
            message: 'Bu okuma kaydını silmek istediğine emin misin? İşlem geri alınamaz.',
            confirmText: 'Sil',
            variant: 'danger',
            onConfirm: async () => {
              const r = await api(`/api/logs/${item.id}`, { method:'DELETE' });
              if(!r.ok){
                const txt = await r.text();
                throw new Error(txt || 'Kayıt silinemedi');
              }
              this.toast('Kayıt silindi');
              await this.reloadBookAndLogs();
            }
          });
        },
        async reloadBookAndLogs(){
          if(!this.book) return;
          const r = await api('/api/books/'+this.book.id);
          if(r.ok) this.book = await r.json();
          await this.fetchLogs();
        },
        openConfirm(opts = {}){
          this.confirm.busy = false;
          Object.assign(this.confirm, {
            open: true,
            title: opts.title || 'Emin misiniz?',
            message: opts.message || '',
            confirmText: opts.confirmText || 'Onayla',
            cancelText: opts.cancelText || 'Vazgeç',
            variant: opts.variant || 'danger',
            action: typeof opts.onConfirm === 'function' ? opts.onConfirm : null
          });
        },
        closeConfirm(){
          if(this.confirm.busy) return;
          this.confirm.open = false;
          this.confirm.action = null;
        },
        confirmButtonClass(){
          return this.confirm.variant === 'danger'
            ? 'bg-red-600 hover:bg-red-700 focus:ring-red-500'
            : 'bg-brand-600 hover:bg-brand-500 focus:ring-brand-500';
        },
        async confirmProceed(){
          if(typeof this.confirm.action !== 'function'){
            this.closeConfirm();
            return;
          }
          this.confirm.busy = true;
          try{
            await this.confirm.action();
            this.confirm.busy = false;
            this.closeConfirm();
          }catch(e){
            const msg = e && e.message ? e.message : (typeof e === 'string' ? e : 'İşlem gerçekleştirilemedi');
            this.toast(msg, 'error');
            this.confirm.busy = false;
          }finally{
            if(this.confirm.busy){
              this.confirm.busy = false;
            }
          }
        },

        // --- Yardımcılar ---
        // dd.mm.yyyy gösterimi
        fmtDate(v){
          if(!v) return '—';
          // beklenen giriş: 'YYYY-MM-DD' veya ISO
          const parts = String(v).split('T')[0].split('-'); // [yyyy, mm, dd]
          if(parts.length===3){
            const [y,m,d] = parts;
            return `${d}.${m}.${y}`;
          }
          // fallback: Date ile
          const d = new Date(v);
          if(isNaN(d)) return v;
          const dd = String(d.getDate()).padStart(2,'0');
          const mm = String(d.getMonth()+1).padStart(2,'0');
          const yy = d.getFullYear();
          return `${dd}.${mm}.${yy}`;
        },

        // gösterimler
        progressPct(b){
          const tp=Number(b?.total_pages||0), cp = b?.is_finished ? tp : Number(b?.current_page||0);
          if(tp<=0) return 0;
          const pct = Math.round((cp/tp)*100);
          return Math.min(100, Math.max(0,pct));
        },
        progressText(b){
          if(!b) return '';
          const tp = Number(b.total_pages||0);
          const cp = b.is_finished ? tp : Number(b.current_page||0);
          const pct = tp>0 ? Math.round((cp/tp)*100) : 0;

          const s = b.started_at ? this.fmtDate(b.started_at) : null;
          const f = b.finished_at ? this.fmtDate(b.finished_at) : null;
          if(b.is_finished && (s||f)) return [s,f].filter(Boolean).join(' • ');

          const dates = [
            s ? `Başlangıç: ${s}` : null,
            f ? `Bitiş: ${f}` : null
          ].filter(Boolean).join(' • ');
          const label = tp>0 ? `${cp}/${tp} (${pct}%)` : '';
          return dates ? `${label} • ${dates}` : label;
        },

        // --- yardımcı: kalan sayfa ---
        remainingPages(){
          if(!this.book) return 0;
          const total = Number(this.book.total_pages || 0);
          const current = this.book.is_finished ? total : Number(this.book.current_page || 0);
          const rem = total - current;
          return rem > 0 ? rem : 0;
        },

        // --- favori: optimistik + animasyon + toast ---
        async toggleFavorite(){
          if(!this.book) return;
          if (this.book._favBusy) return;
          this.book._favBusy = true;

          const prev = !!this.book.favorite;

          // optimistik değişim + kısa animasyon
          this.book.favorite = !prev;
          this.book._favAnim = true;
          setTimeout(()=>{ if(this.book) this.book._favAnim = false; }, 300);

          try{
            const r = await api(`/api/books/${this.book.id}`, {
              method:'PUT',
              headers:{'Content-Type':'application/json'},
              body: JSON.stringify({ favorite: this.book.favorite })
            });
            if(!r.ok) throw new Error('Favori güncellenemedi');

            this.toast(this.book.favorite ? 'Favoriye eklendi' : 'Favoriden çıkarıldı');

          }catch(e){
            // hata: geri al
            if(this.book) this.book.favorite = prev;
            this.toast(e.message || 'Hata oluştu','error');

          }finally{
            if(this.book) this.book._favBusy = false;
          }
        },

        // toast helper
        toast(msg, type='ok'){
          if(window.Toastify){
            Toastify({
              text: msg,
              duration: 3000,
              close: true,
              gravity: "top",
              position: "right",
              stopOnFocus: true,
              className: type === "error" ? "toastify-error" : "toastify-ok",
              style: type === "error"
                ? { background: "#dc2626" }
                : { background: "#4f46e5" }
            }).showToast();
          }else{
            alert(msg);
          }
        },

        openEdit(){
          const b=this.book; if(!b) return;
          this.edit.open=true; this.edit.id=b.id;
          this.edit.model={
            title:b.title||'', author:b.author||'', total_pages:Number(b.total_pages||0),
            cover_url:b.cover_url||'', category:b.category||'', tags:b.tags||'',
            started_at:b.started_at||'', finished_at:b.finished_at||'', is_finished:!!b.is_finished,
            current_page:Number(b.current_page||0), notes:b.notes||'', favorite:!!b.favorite,
            rating: (typeof b.rating === 'number' ? b.rating : null)
          };
        },
        closeEdit(){ this.edit.open=false; this.edit.id=null; },
        async saveEdit(){
          const m=this.edit.model;
          if(!m.title.trim()) return alert('Başlık gerekli');
          if(Number(m.total_pages||0)<=0) return alert('Toplam sayfa 1+ olmalı');
          if(Number(m.current_page||0)>Number(m.total_pages||0)) return alert('Şu anki sayfa toplamdan büyük');

          const ratingNum = Number(m.rating);
          const payload = {
            title:m.title.trim(), author:m.author?.trim()||null, total_pages:Number(m.total_pages||0),
            cover_url:m.cover_url?.trim()||null, category:m.category?.trim()||null, tags:m.tags?.trim()||null,
            started_at:m.started_at||null, finished_at:m.finished_at||null, is_finished:!!m.is_finished,
            current_page:Number(m.current_page||0), notes:m.notes?.trim()||null, favorite:!!m.favorite,
            rating: m.is_finished && !Number.isNaN(ratingNum) ? Math.max(0, Math.min(100, ratingNum)) : null
          };
          try{
            const r = await api(`/api/books/${this.edit.id}`,{
              method:'PUT', headers:{'Content-Type':'application/json'},
              body: JSON.stringify(payload)
            });
            if(!r.ok) throw new Error(await r.text()||'Güncellenemedi');
            this.closeEdit();
            await this.load(); // tek kitabı tazele
          }catch(e){ alert(e.message); }
        },
        async removeBook(){
          if(!this.book) return;
          this.openConfirm({
            title: 'Kitabı Sil',
            message: 'Bu kitabı silmek istediğine emin misin? Bu işlem geri alınamaz.',
            confirmText: 'Evet, sil',
            variant: 'danger',
            onConfirm: async () => {
              const r = await api(`/api/books/${this.book.id}`, { method:'DELETE' });
              if(!r.ok){
                const txt = await r.text();
                throw new Error(txt || 'Kitap silinemedi');
              }
              this.toast('Kitap silindi');
              setTimeout(() => { location.replace('/static/admin/books.html'); }, 400);
            }
          });
        },
        logout(){ localStorage.removeItem('token'); location.replace('/static/admin/login.html'); }
      }
    }
  </script>
</head>

<body class="h-full bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100"
      x-data="bookPage()" x-init="init()">
  <!-- Toast kökü -->
  <div id="toast-root" class="fixed top-4 right-4 z-50 space-y-2"></div>

  <div class="max-w-5xl mx-auto p-4 sm:p-8">
    <!-- Header -->
    <div id="site-header" data-active="books" data-show-add="true"></div>
    
    <!-- İçerik -->
    <template x-if="loading">
      <div class="p-10 text-center text-gray-500">Yükleniyor…</div>
    </template>

    <template x-if="!loading && book">
      <div class="space-y-6">
        <div class="grid md:grid-cols-3 gap-6">
          <!-- Kapak -->
          <div class="md:col-span-1">
            <div class="relative rounded-2xl overflow-hidden border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 shadow-soft">
              <div class="relative w-full aspect-[2/3]">
                <img :src="book.cover_url || ''" class="absolute inset-0 h-full w-full object-cover" @error="$event.target.style.display='none'">
                <button
                  class="absolute top-3 right-3 rounded-full p-2 bg-white/90 dark:bg-gray-900/70 border border-gray-200 dark:border-gray-700 transition-transform duration-200"
                  :class="book._favAnim ? 'scale-110' : ''"
                  @click="toggleFavorite()"
                  :title="book.favorite ? 'Favoriden çıkar' : 'Favoriye ekle'">

                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5"
                      :class="book.favorite ? 'text-rose-500' : 'text-gray-400'"
                      viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" role="img">
                    <path x-show="book.favorite" x-transition
                          d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.198 3 12.74 3 10.25 3 7.75 4.99 6 7.318 6 8.83 6 10.273 6.802 11 8.027 11.727 6.802 13.17 6 14.682 6 17.01 6 19 7.75 19 10.25c0 2.49-1.688 4.948-3.989 7.257a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.218l-.022.012-.007.003a.75.75 0 01-.666 0z"/>
                    <path x-show="!book.favorite" x-transition fill="none" stroke="currentColor" stroke-width="1.8"
                          d="M12 21s-7-4.35-7-10.5A4.5 4.5 0 0 1 9.5 6c1.54 0 2.82.74 3.5 1.88C13.68 6.74 14.96 6 16.5 6A4.5 4.5 0 0 1 19 10.5C19 16.65 12 21 12 21z"/>
                  </svg>
                </button>

                <div class="absolute bottom-3 left-3">
                  <span :class="book.is_finished ? 'bg-emerald-600 text-white' : 'bg-amber-500 text-white'"
                        class="text-[11px] px-2 py-1 rounded-full shadow">
                    <span x-text="book.is_finished ? 'Bitti' : 'Devam'"></span>
                  </span>
                </div>
              </div>
            </div>
          </div>

          <!-- Detaylar -->
          <div class="md:col-span-2">
            <div class="rounded-2xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 shadow-soft p-5">
              <h1 class="text-2xl font-semibold mb-1" x-text="book.title"></h1>
              <div class="text-sm text-gray-500 mb-2" x-text="(book.author||'-') + (book.category ? ' • '+book.category : '')"></div>

              <div x-show="book.rating !== null && book.rating !== undefined" class="mb-4">
                <span class="inline-flex items-center gap-2 text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 border border-gray-200 dark:border-gray-600">
                  <span aria-hidden="true">&#9733;</span>
                  <span x-text="book.rating + '/100'"></span>
                </span>
              </div>

              <!-- İlerleme -->
              <template x-if="(book.total_pages||0) > 0">
                <div class="mb-4">
                  <div class="h-2 rounded bg-gray-200 dark:bg-gray-700 overflow-hidden">
                    <div class="h-2 bg-brand-600" :style="`width: ${progressPct(book)}%`"></div>
                  </div>
                  <div class="mt-1 text-xs text-gray-500" x-text="progressText(book)"></div>
                </div>
              </template>

              <!-- Tarihler kutusu -->
              <div class="grid sm:grid-cols-3 gap-3 mb-4 text-sm">
                <div class="p-3 rounded-xl bg-gray-50 dark:bg-gray-900/40 border border-gray-200 dark:border-gray-700">
                  <div class="text-xs text-gray-500 mb-1">Başlangıç</div>
                  <div x-text="fmtDate(book.started_at)"></div>
                </div>
                <div class="p-3 rounded-xl bg-gray-50 dark:bg-gray-900/40 border border-gray-200 dark:border-gray-700">
                  <div class="text-xs text-gray-500 mb-1">Bitiş</div>
                  <div x-text="fmtDate(book.finished_at)"></div>
                </div>
                <div class="p-3 rounded-xl bg-gray-50 dark:bg-gray-900/40 border border-gray-200 dark:border-gray-700">
                  <div class="text-xs text-gray-500 mb-1">Sayfalar</div>
                  <div x-text="(book.current_page||0) + ' / ' + (book.total_pages||0)"></div>
                </div>
              </div>

              <!-- Etiketler -->
              <template x-if="book.tags">
                <div class="mb-4 flex flex-wrap gap-2">
                  <template x-for="t in (book.tags||'').split(',').map(x=>x.trim()).filter(Boolean)">
                    <span class="text-[11px] px-2 py-1 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300" x-text="t"></span>
                  </template>
                </div>
              </template>

              <!-- Notlar -->
              <div class="mb-4" x-show="book.notes">
                <div class="text-xs text-gray-500 mb-1">Notlar</div>
                <div class="whitespace-pre-wrap break-words leading-relaxed" x-text="book.notes"></div>
              </div>

              <!-- Aksiyonlar -->
              <div class="flex items-center gap-2">
                <a :href="'/static/admin/diary.html?id='+book.id" class="px-3 py-2 rounded-lg bg-amber-500 text-white hover:opacity-95">Günlük</a>
                <button class="px-3 py-2 rounded-lg bg-indigo-600 text-white hover:opacity-95" @click="openEdit()">Düzenle</button>
                <button class="px-3 py-2 rounded-lg bg-red-600 text-white hover:opacity-95" @click="removeBook()">Sil</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Okuma Kayıtları -->
        <section class="rounded-2xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 shadow-soft p-5">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-lg font-semibold">Okuma Kayıtları</h2>
            <button class="px-3 py-2 rounded-lg bg-brand-600 text-white hover:opacity-95" @click="openAddLog()">Kayıt Ekle</button>
          </div>

          <template x-if="logsLoading">
            <div class="p-6 text-center text-gray-500">Yükleniyor…</div>
          </template>

          <template x-if="!logsLoading && logs.length===0">
            <div class="p-6 text-center text-gray-500">Bu kitap için henüz kayıt yok.</div>
          </template>

          <div class="space-y-3" x-show="!logsLoading && logs.length>0">
            <template x-for="item in logs" :key="item.id">
              <div class="flex items-start justify-between gap-3 p-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/40">
                <div class="min-w-0">
                  <div class="text-sm font-medium" x-text="fmtDate(item.log_date)"></div>
                  <div class="text-xs text-gray-500 mt-0.5">
                    <span x-text="'+' + item.pages_read + ' sayfa'"></span>
                    <template x-if="item.finished">
                      <span class="ml-2 inline-flex items-center text-emerald-600">• Bitti</span>
                    </template>
                  </div>
                  <div class="text-sm mt-1 whitespace-pre-wrap break-words" x-show="item.note" x-text="item.note"></div>
                </div>
                <div class="flex items-center gap-1 shrink-0">
                  <!-- edit -->
                  <button class="p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700" @click="openEditLog(item)" title="Düzenle" aria-label="Düzenle">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-600" viewBox="0 0 20 20" fill="currentColor">
                      <path d="M13.586 3.586a2 2 0 112.828 2.828l-9.193 9.193a2 2 0 01-.878.515l-3.12.78a.5.5 0 01-.606-.606l.78-3.12a2 2 0 01.515-.878l9.193-9.193z"/>
                      <path d="M12 5l3 3"/>
                    </svg>
                  </button>
                  <!-- delete -->
                  <button class="p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700" @click="deleteLog(item)" title="Sil" aria-label="Sil">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-600" viewBox="0 0 24 24" fill="currentColor">
                      <path d="M9 3h6a1 1 0 011 1v1h5v2H3V5h5V4a1 1 0 011-1zm-2 6h10l-1 11a2 2 0 01-2 2H10a2 2 0 01-2-2L7 9z"/>
                    </svg>
                  </button>
                </div>
              </div>
            </template>
          </div>
        </section>
      </div>
    </template>
  </div>

  <!-- LOG MODAL -->
  <div x-show="logModal.open" x-transition.opacity class="fixed inset-0 z-50 flex items-center justify-center">
    <div class="absolute inset-0 bg-black/50" @click="closeLogModal()"></div>
    <div @keydown.escape.window="closeLogModal()"
         class="relative w-full max-w-lg mx-auto rounded-2xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-soft p-5">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold" x-text="logModal.mode==='add' ? 'Kayıt Ekle' : 'Kaydı Düzenle'"></h3>
        <button class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300" @click="closeLogModal()">✕</button>
      </div>

      <div class="grid sm:grid-cols-2 gap-3">
        <label class="block">
          <span class="text-sm">Tarih <span class="text-red-500">*</span></span>
          <input type="date" x-model="logModal.form.log_date"
                 class="mt-1 w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        </label>

        <label class="block">
          <span class="text-sm">Okunan Sayfa <span class="text-red-500">*</span></span>
          <input type="number" min="1"
                 x-model.number="logModal.form.pages_read"
                 :disabled="logModal.form.finished"
                 placeholder="Örn. 30"
                 class="mt-1 w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        </label>

        <label class="block sm:col-span-2">
          <span class="text-sm">Not</span>
          <textarea rows="3" x-model="logModal.form.note" placeholder="Kısaca nasıl gitti?"
                    class="mt-1 w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600"></textarea>
        </label>

        <label class="inline-flex items-center gap-2 sm:col-span-2">
          <input type="checkbox" x-model="logModal.form.finished" class="h-4 w-4">
          <span class="text-sm select-none">Kitabı bitirdim</span>
        </label>
      </div>

      <div class="mt-4 flex items-center justify-end gap-3">
        <button class="px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700" @click="closeLogModal()">İptal</button>
        <button class="px-4 py-2 rounded-lg bg-brand-600 text-white hover:opacity-95" @click="saveLog()">Kaydet</button>
      </div>
    </div>
  </div>

  <!-- EDIT MODAL (Kitap) -->
  <div x-show="edit.open" x-transition.opacity class="fixed inset-0 z-50 flex items-center justify-center">
    <div class="absolute inset-0 bg-black/50" @click="closeEdit()"></div>
    <div @keydown.escape.window="closeEdit()"
         class="relative w-full max-w-2xl mx-auto rounded-2xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-soft p-5">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold">Kitabı Düzenle</h3>
        <button class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300" @click="closeEdit()">✕</button>
      </div>

      <div class="grid sm:grid-cols-2 gap-3">
        <input x-model="edit.model.title" placeholder="Başlık *"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        <input x-model="edit.model.author" placeholder="Yazar"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">

        <input x-model.number="edit.model.total_pages" type="number" min="1" placeholder="Toplam sayfa *"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        <input x-model="edit.model.category" placeholder="Kategori"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">

        <input x-model="edit.model.cover_url" placeholder="Kapak URL"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        <input x-model="edit.model.tags" placeholder="Etiketler (virgülle)"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">

        <input x-model="edit.model.started_at" type="date" placeholder="Başlangıç"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">

        <input x-model="edit.model.finished_at" type="date" placeholder="Bitiş"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600"
               :disabled="!edit.model.is_finished">

        <input x-model.number="edit.model.current_page" type="number" min="0" :max="edit.model.total_pages||0" placeholder="Şu anki sayfa"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        <input x-model.number="edit.model.rating" type="number" min="0" max="100" step="1" placeholder="Puan (0-100)"
               :disabled="!edit.model.is_finished"
               class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
               
        <div class="flex items-center gap-2 px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700">
          <input id="edit_is_finished" type="checkbox" x-model="edit.model.is_finished" class="h-4 w-4">
          <label for="edit_is_finished" class="text-sm select-none">Bitti</label>
        </div>
      </div>

      <textarea x-model="edit.model.notes" rows="3" placeholder="Notlar"
                class="mt-3 w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600"></textarea>

      <div class="mt-4 flex items-center justify-end gap-3">
        <button class="px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700" @click="closeEdit()">İptal</button>
        <button class="px-4 py-2 rounded-lg bg-brand-600 text-white hover:opacity-95" @click="saveEdit()">Kaydet</button>
      </div>
    </div>
  </div>

  <!-- Ortak JS: api() kullanımı için -->
  <div x-show="confirm.open" x-transition.opacity class="fixed inset-0 z-[60] flex items-center justify-center">
    <div class="absolute inset-0 bg-black/50" :class="confirm.busy ? 'cursor-not-allowed' : 'cursor-pointer'" @click="closeConfirm()"></div>
    <div @keydown.escape.window="closeConfirm()" class="relative w-full max-w-md mx-auto rounded-2xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-soft p-6">
      <div class="flex flex-col items-center text-center gap-4">
        <div :class="confirm.variant === 'danger' ? 'bg-red-100 text-red-600' : 'bg-indigo-100 text-indigo-600'" class="h-12 w-12 rounded-full flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M5.07 19h13.86c1.54 0 2.49-1.67 1.72-3L13.72 4c-.77-1.33-2.67-1.33-3.44 0L3.35 16c-.77 1.33.18 3 1.72 3z"/>
          </svg>
        </div>
        <div class="space-y-2">
          <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100" x-text="confirm.title"></h3>
          <p class="text-sm text-gray-500 dark:text-gray-300" x-text="confirm.message"></p>
        </div>
        <div class="flex items-center gap-3 w-full">
          <button type="button" class="w-full px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-400 disabled:opacity-60 disabled:cursor-not-allowed" @click="closeConfirm()" :disabled="confirm.busy" x-text="confirm.cancelText"></button>
          <button type="button" class="w-full px-4 py-2 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-60 disabled:cursor-not-allowed" :class="confirmButtonClass()" @click="confirmProceed()" :disabled="confirm.busy">
            <span x-show="!confirm.busy" x-text="confirm.confirmText"></span>
            <span x-show="confirm.busy" class="inline-flex items-center justify-center gap-2">
              <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
              </svg>
            </span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="/static/admin/js/app.js"></script>
  <script defer src="/static/admin/js/header.js"></script>
</body>
</html>
