<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Book - Favorilerim</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/admin/css/custom.css"/>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { 600: '#4f46e5' } },
          boxShadow: { soft: '0 8px 30px rgba(0,0,0,.08)' }
        }
      }
    }
  </script>

  <script>
    (function(){
      if(!localStorage.getItem('token')){
        window.location.replace('/static/admin/login.html');
      }
    })();
  </script>
</head>
<body class="h-full bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100" x-data="app()" x-init="init()">
  <div id="toast-root" class="fixed top-4 right-4 z-50 space-y-2"></div>

  <div class="max-w-6xl mx-auto p-5 sm:p-8 space-y-6">
    <div id="site-header" data-active="favorites"></div>

    <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
      <div class="flex items-center gap-3">
        <h1 class="text-xl font-semibold">Favorilerim</h1>
        <span class="text-xs px-2 py-1 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300"
              x-text="favoriteBooks().length ? favoriteBooks().length + ' kitap' : ''"></span>
      </div>

      <div class="flex items-center gap-2">
        <label class="hidden sm:flex items-center gap-2 text-sm text-gray-600 dark:text-gray-300">
          <span>Sırala</span>
          <select x-model="sort" class="px-3 py-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800">
            <option value="created_desc">Eklenme (Yeni → Eski)</option>
            <option value="created_asc">Eklenme (Eski → Yeni)</option>
            <option value="started_desc">Başlama (Yeni → Eski)</option>
            <option value="started_asc">Başlama (Eski → Yeni)</option>
            <option value="rating_desc">Puan (Yüksek → Düşük)</option>
            <option value="rating_asc">Puan (Düşük → Yüksek)</option>
          </select>
        </label>
        <select x-model="sort" class="sm:hidden px-3 py-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm">
          <option value="created_desc">Eklenme (Yeni → Eski)</option>
          <option value="created_asc">Eklenme (Eski → Yeni)</option>
          <option value="started_desc">Başlama (Yeni → Eski)</option>
          <option value="started_asc">Başlama (Eski → Yeni)</option>
          <option value="rating_desc">Puan (Yüksek → Düşük)</option>
          <option value="rating_asc">Puan (Düşük → Yüksek)</option>
        </select>
      </div>
    </div>

    <section class="bg-transparent">
      <template x-if="loading">
        <div class="p-6 text-center text-gray-500">Yükleniyor…</div>
      </template>

      <template x-if="!loading && favoriteBooks().length === 0">
        <div class="p-12 text-center text-gray-500 border border-dashed border-gray-300 dark:border-gray-700 rounded-2xl">
          Henüz favori kitabın yok. <a href="/static/admin/books.html" class="text-brand-600 underline">Kitaplarını görüntüle</a>.
        </div>
      </template>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
        <template x-for="b in favoriteBooks()" :key="b.id">
          <div class="rounded-2xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-soft overflow-hidden flex flex-col transition-transform duration-150 hover:-translate-y-0.5 hover:shadow-lg">
            <div class="relative w-full aspect-[2/3]">
              <a :href="'/static/admin/book.html?id='+b.id" class="absolute inset-0 z-[1]" aria-label="Detay"></a>
              <img :src="b.cover_url || ''" class="absolute inset-0 h-full w-full object-cover rounded-t-2xl" :alt="b.title">
              <div class="absolute top-0 left-0 right-0 h-20 bg-gradient-to-b from-black/60 to-transparent"></div>
              <div class="absolute top-3 left-3 flex flex-wrap gap-2 text-xs text-white z-[2]">
                <span class="px-2 py-0.5 rounded-full bg-black/40 backdrop-blur-sm" x-text="b.category || 'Genel'"></span>
                <span x-show="b.is_finished" class="px-2 py-0.5 rounded-full bg-green-500/80">Bitti</span>
              </div>
              <button @click.stop="toggleFavorite(b)"
                      :class="{'scale-95 opacity-75': b._favBusy, 'animate-ping-once': b._favAnim}"
                      class="absolute bottom-3 right-3 z-[2] h-10 w-10 rounded-full bg-white/90 backdrop-blur shadow flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" :class="b.favorite ? 'text-yellow-500' : 'text-gray-300'" viewBox="0 0 20 20" fill="currentColor">
                  <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.719c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                </svg>
              </button>
            </div>

            <div class="flex-1 p-4 flex flex-col gap-3">
              <div>
                <h3 class="text-base font-semibold text-gray-800 dark:text-gray-100 line-clamp-2" x-text="b.title"></h3>
                <p class="text-xs text-gray-500 dark:text-gray-400" x-text="b.author || 'Bilinmeyen yazar'"></p>
              </div>

              <div class="flex items-center justify-between text-xs text-gray-500 dark:text-gray-300">
                <span x-text="(b.total_pages || 0) + ' sayfa'"></span>
                <span x-show="b.rating !== null && b.rating !== undefined"
                      class="text-[11px] px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 border border-gray-200 dark:border-gray-600 inline-flex items-center gap-1">
                  <span aria-hidden="true">★</span>
                  <span x-text="b.rating + '/100'"></span>
                </span>
              </div>

              <div class="h-2 rounded-full bg-gray-100 dark:bg-gray-700 overflow-hidden">
                <div class="h-full bg-brand-600" :style="`width:${progressPct(b)}%`"></div>
              </div>
              <div class="text-xs text-gray-500 dark:text-gray-300" x-text="progressText(b)"></div>

              <!-- <div class="flex items-center justify-between mt-auto pt-2">
                <a :href="'/static/admin/book.html?id='+b.id" class="text-brand-600 text-sm font-medium hover:underline">Detay</a>
                <button @click="openEdit(b)" class="text-sm text-gray-500 hover:text-brand-600">Düzenle</button>
              </div> -->
            </div>
          </div>
        </template>
      </div>
    </section>
  </div>

  <!-- Modals -->
  <div x-show="add.open" x-transition.opacity class="fixed inset-0 z-50 flex items-center justify-center">
    <div class="absolute inset-0 bg-black/50" @click="closeAdd()"></div>
    <div class="relative w-full max-w-2xl mx-auto rounded-2xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-soft p-5">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold">Yeni Kitap</h3>
        <button class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300" @click="closeAdd()">✕</button>
      </div>
      <div class="grid sm:grid-cols-2 gap-3">
        <input x-model="form.title" placeholder="Başlık *" class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        <input x-model="form.author" placeholder="Yazar" class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        <input x-model.number="form.total_pages" type="number" min="1" placeholder="Toplam sayfa *" class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        <input x-model="form.category" placeholder="Kategori" class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        <input x-model="form.cover_url" placeholder="Kapak URL" class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        <input x-model="form.tags" placeholder="Etiketler (virgülle)" class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        <input x-model="form.started_at" type="date" placeholder="Başlangıç" class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        <input x-model="form.finished_at" type="date" placeholder="Bitiş" class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600" :disabled="!form.is_finished">
        <div class="flex items-center gap-2 px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700">
          <input id="add_is_finished" type="checkbox" x-model="form.is_finished" class="h-4 w-4">
          <label for="add_is_finished" class="text-sm select-none">Bitti</label>
        </div>
        <input x-model.number="form.current_page" type="number" min="0" :max="form.total_pages||0" placeholder="Şu anki sayfa" class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        <label class="block">
          <span class="text-sm">Puan (0-100)</span>
          <input x-model.number="form.rating" type="number" min="0" max="100" step="1" placeholder="Örn. 85" :disabled="!form.is_finished" class="mt-1 w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
          <p class="mt-1 text-xs text-gray-500">Sadece "Bitti" işaretliyken kaydedilir.</p>
        </label>
        <div class="flex items-center gap-2 px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700">
          <input id="add_favorite" type="checkbox" x-model="form.favorite" class="h-4 w-4">
          <label for="add_favorite" class="text-sm select-none">Favori</label>
        </div>
      </div>
      <label class="block mt-3">
        <span class="text-sm">Notlar</span>
        <textarea x-model="form.notes" rows="3" placeholder="İlk izlenimlerin, alıntılar, vb." class="mt-1 w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600"></textarea>
      </label>
      <div class="mt-4 flex items-center justify-end gap-3">
        <span class="text-xs text-gray-500 mr-auto"><span class="text-red-500">*</span> zorunlu alanlar</span>
        <button class="px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700" @click="closeAdd()">İptal</button>
        <button class="px-4 py-2 rounded-lg bg-brand-600 text-white hover:opacity-95" @click="createBook()">Ekle</button>
      </div>
    </div>
  </div>

  <div x-show="edit.open" x-transition.opacity class="fixed inset-0 z-50 flex items-center justify-center">
    <div class="absolute inset-0 bg-black/50" @click="closeEdit()"></div>
    <div class="relative w-full max-w-2xl mx-auto rounded-2xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-soft p-5">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold">Kitabı Düzenle</h3>
        <button class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300" @click="closeEdit()">✕</button>
      </div>
      <div class="grid sm:grid-cols-2 gap-3">
        <input x-model="edit.model.title" placeholder="Başlık *" class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        <input x-model="edit.model.author" placeholder="Yazar" class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        <input x-model.number="edit.model.total_pages" type="number" min="1" placeholder="Toplam sayfa *" class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        <input x-model="edit.model.category" placeholder="Kategori" class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        <input x-model="edit.model.cover_url" placeholder="Kapak URL" class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        <input x-model="edit.model.tags" placeholder="Etiketler (virgülle)" class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        <input x-model="edit.model.started_at" type="date" placeholder="Başlangıç" class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        <input x-model="edit.model.finished_at" type="date" placeholder="Bitiş" class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600" :disabled="!edit.model.is_finished">
        <div class="flex items-center gap-2 px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700">
          <input id="edit_is_finished" type="checkbox" x-model="edit.model.is_finished" class="h-4 w-4">
          <label for="edit_is_finished" class="text-sm select-none">Bitti</label>
        </div>
        <input x-model.number="edit.model.current_page" type="number" min="0" :max="edit.model.total_pages||0" placeholder="Şu anki sayfa" class="px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        <label class="block">
          <span class="text-sm">Puan (0-100)</span>
          <input x-model.number="edit.model.rating" type="number" min="0" max="100" step="1" placeholder="Puan" :disabled="!edit.model.is_finished" class="mt-1 w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
        </label>
        <div class="flex items-center gap-2 px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700">
          <input id="edit_favorite" type="checkbox" x-model="edit.model.favorite" class="h-4 w-4">
          <label for="edit_favorite" class="text-sm select-none">Favori</label>
        </div>
      </div>
      <textarea x-model="edit.model.notes" rows="3" placeholder="Notlar" class="mt-3 w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600"></textarea>
      <div class="mt-4 flex items-center justify-end gap-3">
        <button class="px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700" @click="closeEdit()">İptal</button>
        <button class="px-4 py-2 rounded-lg bg-brand-600 text-white hover:opacity-95" @click="saveEdit()">Kaydet</button>
      </div>
    </div>
  </div>

  <script src="/static/admin/js/app.js"></script>
  <script defer src="/static/admin/js/header.js"></script>
</body>
</html>
