<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Giriş Yap — Book</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode:'class' }
  </script>
  <script>
    // zaten girişliyse ana sayfaya dön
    (function(){
        if(localStorage.getItem('token')){
        window.location.replace('/');
        }
    })();
    </script>

</head>
<body class="h-full bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100"
      onload="initTheme()">

  <div class="min-h-full flex items-center justify-center p-6">
    <div class="w-full max-w-md rounded-2xl bg-white dark:bg-gray-800 shadow-lg border border-gray-200 dark:border-gray-700 p-6">
      <div class="flex items-center justify-between mb-4">
        <h1 class="text-xl font-semibold">Giriş Yap</h1>
        <button class="px-2 py-1 rounded-lg bg-gray-200 dark:bg-gray-700" onclick="toggleTheme()">🌗</button>
      </div>

      <form id="loginForm" class="space-y-3" onsubmit="return login(event)">
        <div>
          <label class="block text-sm mb-1">E-posta</label>
          <input id="email" type="email" required
                 class="w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-sm mb-1">Parola</label>
          <div class="relative">
            <input id="password" type="password" required
                   class="w-full px-3 py-2 pr-10 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-indigo-500">
            <button type="button" class="absolute right-2 top-1/2 -translate-y-1/2 text-sm text-gray-500"
                    onclick="togglePassword('password')">Göster</button>
          </div>
        </div>

        <button type="submit"
                class="w-full mt-2 px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white">
          Giriş Yap
        </button>

        <p id="err" class="text-sm text-red-600 hidden"></p>

        <p class="text-sm text-gray-500 mt-2">
          Hesabın yok mu?
          <a href="/static/admin/register.html" class="text-indigo-600 hover:underline">Kayıt ol</a>
        </p>
      </form>
    </div>
  </div>

<script>
function initTheme(){
  const isDark = localStorage.getItem('theme')==='dark';
  document.documentElement.classList.toggle('dark', isDark);
}
function toggleTheme(){
  const root = document.documentElement;
  const isDark = !root.classList.contains('dark');
  root.classList.toggle('dark', isDark);
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
function togglePassword(id){
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
}
async function login(e){
  e.preventDefault();
  const err = document.getElementById('err');
  err.classList.add('hidden'); err.textContent = '';

  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;

  try{
    const r = await fetch('/api/auth/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email, password })
    });
    if(!r.ok){
      const txt = await r.text();
      throw new Error(txt || 'Giriş başarısız');
    }
    const { token } = await r.json();
    localStorage.setItem('token', token);
    // (opsiyonel) kullanıcı bilgisini cachelemek istersen /api/auth/me çağrısı yapılabilir.
    location.href = '/';
  }catch(e){
    err.textContent = e.message.replace(/^"|"$/g,'');
    err.classList.remove('hidden');
  }
  return false;
}
</script>
</body>
</html>
