<!-- /static/admin/partials/header.html -->
<header class="mb-6">
  <div class="flex items-center justify-between">
    <!-- Sol: Logo + Nav -->
    <div class="flex items-center gap-5">
      <div class="h-10 w-10 rounded-xl bg-brand-600 text-white flex items-center justify-center font-semibold">CK</div>
      <nav class="hidden sm:flex items-center gap-2 text-sm">
        <a href="/static/admin/index.html"
           class="px-3 py-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 hdr-link"
           data-key="home">Anasayfa</a>
        <a href="/static/admin/books.html"
           class="px-3 py-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 hdr-link"
           data-key="books">Kütüphanem</a>

      </nav>
    </div>

    <!-- Sağ: Tema + Kullanıcı menüsü -->
    <div class="flex items-center gap-3">
      <button class="px-3 py-2 rounded-lg bg-gray-200 dark:bg-gray-700" data-action="toggle-theme">🌗</button>

      <!-- User menu (dropdown) -->
      <div class="relative" data-user-menu>
        <button data-user-toggle
                class="flex items-center gap-3 rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 px-3 py-2 hover:bg-gray-50 dark:hover:bg-gray-700 transition">
          <div class="h-8 w-8 rounded-full bg-gray-200 dark:bg-gray-700 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600 dark:text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A9 9 0 1118.88 6.196 9 9 0 015.12 17.804z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0zM7 17a7 7 0 0110 0" />
            </svg>
          </div>
          <div class="text-left hidden sm:block">
            <div class="text-sm font-medium" data-user-name>Kullanıcı</div>
            <div class="text-xs text-gray-500 dark:text-gray-400" data-user-email></div>
          </div>
          <svg class="h-4 w-4 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>

        <div data-user-dropdown
             class="hidden absolute right-0 mt-2 w-48 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow-lg overflow-hidden z-50">
          <a href="/static/admin/profile.html"
             class="block px-4 py-2 text-sm hover:bg-gray-50 dark:hover:bg-gray-700">Profil</a>
          <a href="/static/admin/favorites.html"
             class="block px-4 py-2 text-sm hover:bg-gray-50 dark:hover:bg-gray-700">Favorilerim</a>
          <button class="block w-full text-left px-4 py-2 text-sm hover:bg-gray-50 dark:hover:bg-gray-700"
                  data-logout>Çıkış Yap</button>
        </div>
      </div>
    </div>
  </div>
</header>
