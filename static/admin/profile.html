<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Profil — Kütüphanem</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/admin/css/custom.css"/>

  <script>
    tailwind.config = {
      darkMode:'class',
      theme:{ extend:{
        colors:{ brand:{600:'#4f46e5'} },
        boxShadow:{soft:'0 8px 30px rgba(0,0,0,.08)'}
      } }
    }
  </script>

  <!-- token yoksa login'e -->
  <script>
    (function(){
      if(!localStorage.getItem('token')){
        window.location.replace('/static/admin/login.html');
      }
    })();
  </script>
</head>

<body class="h-full bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100"
      x-data="profilePage()" x-init="init()">

  <!-- Toast kökü -->
  <div id="toast-root" class="fixed top-4 right-4 z-50 space-y-2"></div>

  <div class="max-w-4xl mx-auto p-5 sm:p-8">
    <!-- HEADER -->
    <div id="site-header" data-show-add="true"></div>

    <!-- CONTENT -->
    <section class="grid md:grid-cols-3 gap-6">
      <!-- Sol: özet kart -->
      <div class="md:col-span-1">
        <div class="rounded-2xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 shadow-soft p-5 flex flex-col items-center text-center">
          <div class="h-20 w-20 rounded-full bg-indigo-600 text-white flex items-center justify-center text-2xl font-semibold">
            <span x-text="initials(user?.display_name || user?.email || 'K')"></span>
          </div>
          <h2 class="mt-3 font-semibold" x-text="user?.display_name || 'İsimsiz'"></h2>
          <div class="text-sm text-gray-500" x-text="user?.email || ''"></div>

          <div class="mt-4 w-full grid grid-cols-2 gap-2 text-xs">
            <div class="rounded-lg bg-gray-50 dark:bg-gray-900/40 border border-gray-200 dark:border-gray-700 p-3">
              Tema
              <div class="mt-2 text-sm font-medium" x-text="isDark ? 'Koyu' : 'Açık'"></div>
            </div>
            <div class="rounded-lg bg-gray-50 dark:bg-gray-900/40 border border-gray-200 dark:border-gray-700 p-3">
              Oturum
              <div class="mt-2 text-sm font-medium">Aktif</div>
            </div>
          </div>

          <button class="mt-4 px-3 py-2 rounded-lg bg-gray-200 dark:bg-gray-700" @click="toggleTheme()">Temayı Değiştir</button>
          <button class="mt-2 px-3 py-2 rounded-lg bg-red-600 text-white hover:opacity-95" @click="logout()">Çıkış Yap</button>
        </div>
      </div>

      <!-- Sağ: formlar -->
      <div class="md:col-span-2 space-y-6">
        <!-- Profil bilgileri -->
        <div class="rounded-2xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 shadow-soft p-5">
          <h3 class="text-lg font-semibold mb-4">Profil Bilgileri</h3>
          <div class="grid sm:grid-cols-2 gap-4">
            <label class="block">
              <span class="text-sm">Görünen Ad</span>
              <input x-model="form.display_name" placeholder="Ad Soyad"
                     class="mt-1 w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
            </label>

            <label class="block">
              <span class="text-sm">E-posta</span>
              <input :value="user?.email || ''" disabled
                     class="mt-1 w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700/60 outline-none text-gray-500">
            </label>
          </div>

          <div class="mt-4 flex items-center justify-end gap-3">
            <!-- <button class="px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700" @click="resetForm()">Vazgeç</button> -->
            <button class="px-4 py-2 rounded-lg bg-brand-600 text-white hover:opacity-95" @click="saveProfile()">Kaydet</button>
          </div>
        </div>

        <!-- Şifre değiştir (opsiyonel) -->
        <div class="rounded-2xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 shadow-soft p-5">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-semibold">Şifre Değiştir</h3>
            <!-- <span class="text-xs text-gray-500">Bu bölüm backend’inizde <code>/api/auth/change-password</code> varsa çalışır.</span> -->
          </div>

          <div class="grid sm:grid-cols-3 gap-4 mt-3">
            <label class="block">
              <span class="text-sm">Mevcut Şifre</span>
              <input type="password" x-model="pw.old" class="mt-1 w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
            </label>
            <label class="block">
              <span class="text-sm">Yeni Şifre</span>
              <input type="password" x-model="pw.new1" class="mt-1 w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
            </label>
            <label class="block">
              <span class="text-sm">Yeni Şifre (tekrar)</span>
              <input type="password" x-model="pw.new2" class="mt-1 w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-600">
            </label>
          </div>

          <div class="mt-4 flex items-center justify-end">
            <button class="px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700" @click="clearPw()">Temizle</button>
            <button class="ml-2 px-4 py-2 rounded-lg bg-emerald-600 text-white hover:opacity-95" @click="changePassword()">Şifreyi Güncelle</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="/static/admin/js/app.js"></script>
  <script defer src="/static/admin/js/header.js"></script>

  <script>
    function profilePage(){
      return {
        isDark: localStorage.getItem('theme')==='dark',
        user: null,
        form: { display_name:'' },
        pw: { old:'', new1:'', new2:'' },

        async init(){
          document.documentElement.classList.toggle('dark', this.isDark);
          try{
            const r = await api('/api/auth/me');
            if(!r.ok) throw new Error('Kullanıcı bilgisi alınamadı');
            this.user = await r.json();
            this.resetForm();
          }catch(e){
            this.toast(e.message || 'Hata', 'error');
          }
        },

        // UI helpers
        toggleTheme(){
          this.isDark = !this.isDark;
          document.documentElement.classList.toggle('dark', this.isDark);
          localStorage.setItem('theme', this.isDark?'dark':'light');
        },
        initials(s){
          s = (s||'').trim();
          if(!s) return 'K';
          const parts = s.split(/\s+/).slice(0,2);
          return parts.map(p=>p[0]?.toUpperCase()||'').join('');
        },

        // Profile form
        resetForm(){
          this.form.display_name = this.user?.display_name || '';
        },
        async saveProfile(){
          const name = (this.form.display_name||'').trim();
          try{
            const r = await api('/api/auth/me', {
              method:'PUT',
              headers:{'Content-Type':'application/json'},
              body: JSON.stringify({ display_name: name || null })
            });
            if(!r.ok){
              const txt = await r.text();
              throw new Error(txt || 'Profil güncellenemedi');
            }
            // me'yi tazele
            const me = await (await api('/api/auth/me')).json();
            this.user = me;
            this.resetForm();
            this.toast('Profil güncellendi');
          }catch(e){
            this.toast(e.message || 'Hata', 'error');
          }
        },

        // Password form
        clearPw(){ this.pw = {old:'', new1:'', new2:''}; },
        async changePassword(){
          if(!this.pw.old || !this.pw.new1 || !this.pw.new2){
            this.toast('Tüm şifre alanlarını doldurun', 'error'); return;
          }
          if(this.pw.new1 !== this.pw.new2){
            this.toast('Yeni şifreler eşleşmiyor', 'error'); return;
          }
          try{
            const r = await api('/api/auth/change-password', {
              method:'POST',
              headers:{'Content-Type':'application/json'},
              body: JSON.stringify({ current_password: this.pw.old, new_password: this.pw.new1 })
            });
            if(!r.ok){
              const txt = await r.text();
              throw new Error(txt || 'Şifre güncellenemedi');
            }
            this.clearPw();
            this.toast('Şifre güncellendi');
          }catch(e){
            this.toast(e.message || 'Şifre güncellenemedi', 'error');
          }
        },

        logout(){
          localStorage.removeItem('token');
          window.location.replace('/static/admin/login.html');
        },

        toast(msg, type='ok'){
          const root = document.getElementById('toast-root');
          const el = document.createElement('div');
          el.className = `toast ${type==='error'?'toast-error':'toast-ok'}`;
          el.textContent = msg;
          root.appendChild(el);
          setTimeout(()=>{ el.classList.add('hide'); setTimeout(()=>el.remove(),200); }, 1800);
        }
      }
    }
  </script>
</body>
</html>
